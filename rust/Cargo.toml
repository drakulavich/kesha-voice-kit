[package]
name = "kesha-engine"
version = "1.24.7"
edition = "2021"
description = "Inference engine for Kesha Voice Kit: ASR + language detection"
# Not for crates.io. The library target (`src/lib.rs`) exists only for the
# in-tree integration tests; the binary (`src/main.rs`) is the public
# surface and ships via GitHub Releases. See #267 F17 / #313 P0.
publish = false

[lib]
name = "kesha_engine"
path = "src/lib.rs"

[[bin]]
name = "kesha-engine"
path = "src/main.rs"
test = false

[features]
default = ["onnx", "tts"]
# ASR backend selection. Language detection always uses ONNX regardless.
# `libc` is used by the coreml backend to silence FluidAudio's stdout during
# transcribe calls — without it, the Swift-side `print("Transcribe error:
# invalidAudioData")` (see #259) interleaves with kesha-engine's JSON output.
coreml = ["dep:fluidaudio-rs", "dep:libc"]
onnx = []
tts = ["dep:thiserror", "dep:ssml-parser", "dep:opusic-sys", "dep:ogg", "dep:flacenc"]
# macOS-only AVSpeechSynthesizer backend for `macos-*` voices (#141).
# Opt-in — builds a Swift sidecar via swiftc in build.rs. Silently no-op on
# non-macOS targets even when enabled.
system_tts = ["tts"]
# macOS arm64 Kokoro via FluidAudio (native fluidaudio-rs binding). Keeps
# Linux/Windows on the existing ONNX Kokoro path; darwin-arm64 release builds
# use the ANE for English TTS.
system_kokoro = ["tts", "dep:fluidaudio-rs", "dep:libc"]
# darwin-arm64 speaker diarization via FluidAudio (#199), through the native
# fluidaudio-rs `diarize_file_with_models` (pre-staged model, no download).
system_diarize = ["dep:fluidaudio-rs", "dep:libc"]
# macOS-only fast-path for `detect-text-lang`: precompiled NLLanguageRecognizer
# sidecar replacing the per-call `swift -e` shell-out. Opt-in — requires
# `swiftc` at build time (build.rs::build_text_lang_helper). When off, the
# macOS arm of text_lang.rs falls back to the legacy `swift -e` path, so
# minimal dev environments without Xcode CLT continue to build.
system_text_lang = []

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# Audio decoding
symphonia = { version = "0.5", features = ["mp3", "ogg", "flac", "aac", "pcm", "wav", "isomp4"] }
symphonia-adapter-libopus = "0.2"
rubato = "2"

# HTTP downloads
ureq = "3"
dirs = "6"
# Bounded thread pool for concurrent model fetches (#178). Rayon's blocking
# threads fit ureq's blocking API; we cap the pool at 4 workers ourselves.
rayon = "1"

# ONNX Runtime: always needed for audio language detection (speechbrain);
# also drives ASR transcription when the `onnx` feature is enabled.
ort = { version = "2.0.0-rc.12" }
ndarray = { version = "0.17" }

# FluidAudio (macOS): ASR (CoreML/ANE), native Kokoro TTS, and model-path
# diarization. Back on the fork — NOT a leftover, do not "restore" upstream: it
# carries two things upstream lacks, both prerequisites for open work.
# `FluidAudio::with_models_dir` roots ASR/Kokoro/compile-cache under one
# directory (#688), and `init_kokoro_with_compute_units` selects CoreML compute
# units, which is the only way Kokoro runs where no ANE is exposed (#678 — the
# default pins the vocoder stage to it, so a hosted macOS runner cannot even
# prepare the program). Retire the fork once both land upstream.
# Trade-off to know: this rev trails `FluidInference/main`, so upstream commits
# after the previous pin are not present. Everything kesha calls is verified to
# build against it. Tracks FluidAudio Swift 0.15.5 (#709); the fork's `qwen3_*`
# bindings are gone because 0.15.3 removed the backend upstream.
# `init_kokoro` still takes `lang` → `zh` selects `.mandarin` (tone-aware
# Mandarin G2P), else `.english` (#492); `--rate` stays model-native (#475).
fluidaudio-rs = { git = "https://github.com/drakulavich/fluidaudio-rs", rev = "dc931c5be72cf94700b8f53027391421ba0a0628", optional = true }
audioadapter-buffers = "3.0.0"

# TTS (Kokoro + SSML parser; G2P via ONNX ByT5 at runtime, see #123)
hound = "3.5"
thiserror = { version = "2", optional = true }
sha2 = "0.10"
ssml-parser = { version = "0.1", optional = true }

# Opus encoding for `kesha say --format ogg-opus` (#223). Encode drives the
# `opusic-sys` FFI — the SAME libopus `symphonia-adapter-libopus` links for
# decode — so the binary carries exactly one static libopus (why this isn't the
# safe `opus`/`audiopus_sys` crate: see the OpusEncoder doc in tts/encode.rs,
# #585). `ogg` is a pure-Rust container muxer.
opusic-sys = { version = "0.7", optional = true }
ogg = { version = "0.9", optional = true }

libc = { version = "0.2", optional = true }
# Keep G2P dependency changes explicit; intentional bumps should review the
# source-level routing/shape smoke tests instead of relying on transitive drift.
misaki-rs = { version = "=0.3.0", default-features = false }
vosk_tts = { path = "vendor/vosk-tts" }
flacenc = { version = "0.5.1", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.15"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
