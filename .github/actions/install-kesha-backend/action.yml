name: Install Kesha Backend
description: Restore backend cache, install ffmpeg when needed, and install the Kesha backend

inputs:
  cache-path:
    description: Optional backend cache path(s)
    required: false
    default: ""
  cache-key:
    description: Cache key for the backend cache
    required: false
    default: ""
  cache-restore-keys:
    description: Cache restore key prefix
    required: false
    default: ""
  ffmpeg-provider:
    description: How to install ffmpeg (skip, apt, or brew)
    required: false
    default: skip
  install-args:
    description: Additional arguments for `kesha install`
    required: false
    default: ""
  engine-dir:
    description: When set, delete this engine dir after cache restore so the install really downloads
    required: false
    default: ""
  install-log:
    description: When set, tee the install output to this file so a job can assert on it
    required: false
    default: ""
  cache-write:
    description: Set false so PR runs only read the cache; cache-seed.yml owns writing on main (#661)
    required: false
    default: "true"
  cache-cross-os:
    description: One OS-less entry shared by the Linux and Windows model lanes; must match on save and restore or the versions diverge and every read misses (#860)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: 💾 Cache backend
      if: ${{ inputs.cache-path != '' && inputs.cache-write == 'true' }}
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ inputs.cache-path }}
        key: ${{ inputs.cache-key }}
        restore-keys: ${{ inputs.cache-restore-keys }}
        enableCrossOsArchive: ${{ inputs.cache-cross-os == 'true' }}

    - name: 💾 Restore backend cache
      if: ${{ inputs.cache-path != '' && inputs.cache-write != 'true' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.cache-path }}
        key: ${{ inputs.cache-key }}
        restore-keys: ${{ inputs.cache-restore-keys }}
        enableCrossOsArchive: ${{ inputs.cache-cross-os == 'true' }}

    # `!dir/sub` does NOT exclude children of an included dir (actions/toolkit#713), so purge explicitly.
    - name: 🧊 Force a cold engine download
      if: ${{ inputs.engine-dir != '' }}
      shell: bash
      env:
        ENGINE_DIR: ${{ inputs.engine-dir }}
      run: |
        # A quoted "~/…" is a literal path, so the rm would no-op and the assert would still pass.
        dir="${ENGINE_DIR/#\~/$HOME}"
        rm -rf "$dir"
        test ! -e "$dir"

    - name: 🎬 Install ffmpeg
      shell: bash
      env:
        FFMPEG_PROVIDER: ${{ inputs.ffmpeg-provider }}
      run: |
        case "$FFMPEG_PROVIDER" in
          apt) sudo apt-get update -qq && sudo apt-get install -y ffmpeg ;;
          brew) which ffmpeg || brew install ffmpeg ;;
          skip) exit 0 ;;
          *) echo "Unsupported ffmpeg provider: $FFMPEG_PROVIDER" >&2; exit 1 ;;
        esac

    - name: 🔊 Install kesha backend
      shell: bash
      env:
        INSTALL_ARGS: ${{ inputs.install-args }}
        INSTALL_LOG: ${{ inputs.install-log }}
      run: |
        bun link
        if [ -n "$INSTALL_LOG" ]; then
          kesha install $INSTALL_ARGS 2>&1 | tee "$INSTALL_LOG"
        else
          kesha install $INSTALL_ARGS
        fi

    # A cold install that silently reused a cached binary would green while testing nothing.
    - name: 🧊 Assert the engine really downloaded
      if: ${{ inputs.engine-dir != '' && inputs.install-log != '' }}
      shell: bash
      env:
        INSTALL_LOG: ${{ inputs.install-log }}
      run: grep -q "Engine binary downloaded" "$INSTALL_LOG"
