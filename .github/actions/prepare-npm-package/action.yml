name: Prepare the npm package
description: Apply the release version, inject the Engine pin from its SHA256SUMS and asset sizes and verify the packed tarball; publishing is the caller's step

inputs:
  version:
    description: The version this run publishes
    required: true
  engine-version:
    description: The Engine the published CLI resolves
    required: true
  engine-built:
    description: "'true' when this run built and assembled that Engine, so its SHA256SUMS is an artifact rather than a published release"
    required: true

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .bun-version
    # Trusted Publishing needs Node >= 22.14 and npm >= 11.5.1; no NODE_AUTH_TOKEN is set.
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "lts/*"
        registry-url: "https://registry.npmjs.org"
        package-manager-cache: false
    - name: Take the checksums and sizes of the Engine built in this run
      if: inputs.engine-built == 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: release-checksums
        path: engine-checksums
    # A per-merge alpha, or a dispatch naming an Engine prerelease, builds nothing and resolves a published Engine.
    - name: Fetch the checksums and sizes of the published Engine it resolves
      if: inputs.engine-built != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ENGINE_VERSION: ${{ inputs.engine-version }}
      run: |
        gh release download "v$ENGINE_VERSION" --repo drakulavich/kesha-voice-kit --pattern SHA256SUMS --dir engine-checksums
        gh release view "v$ENGINE_VERSION" --repo drakulavich/kesha-voice-kit --json assets --jq .assets > engine-checksums/assets.json
    - name: Apply the release version
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: node .github/scripts/set-package-version.mjs "$VERSION"
    - name: Inject the Engine pin
      shell: bash
      env:
        ENGINE_VERSION: ${{ inputs.engine-version }}
      run: bun .github/scripts/engine-pin.ts inject engine-checksums "$ENGINE_VERSION"
    - name: Pack and verify the tarball
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        ENGINE_VERSION: ${{ inputs.engine-version }}
      run: bun .github/scripts/npm-pack-verify.ts
