name: 🧪 CI

on:
  pull_request:
    branches: [main]
  # Also run on push to main to catch regressions that slip through admin
  # force-merges, post-merge hotfixes, or any other code path that lands on
  # main without exercising the PR gate. The `changes` path-filter still
  # applies — on push events, dorny/paths-filter diffs against the previous
  # commit on `main`, so an unrelated touch doesn't run the full matrix.
  push:
    branches: [main]
  # Nightly heavy real-engine e2e on main: model-format/engine drift gate, and
  # it warms the default-branch-scoped model cache so PR heavy runs restore it.
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read
  # `id-token: write` is NOT granted at workflow scope — it's elevated
  # only on the three test jobs that actually upload to Flakiness.io
  # (Greptile #301 P1 security finding). `changes` and `raycast-lint` run
  # third-party actions and don't need OIDC capability.
  # `pull-requests: write` was previously needed for a sticky test-results
  # comment; removed alongside #303 when Flakiness.io took over the
  # "where did the tests land" surface.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      integration: ${{ steps.filter.outputs.integration }}
      real_engine_e2e: ${{ steps.filter.outputs.real_engine_e2e }}
      tts_e2e: ${{ steps.filter.outputs.tts_e2e }}
      raycast: ${{ steps.filter.outputs.raycast }}
      openspec: ${{ steps.filter.outputs.openspec }}
      workflows: ${{ steps.filter.outputs.workflows }}
      recipes: ${{ steps.filter.outputs.recipes }}
      homebrew: ${{ steps.filter.outputs.homebrew }}
      docker: ${{ steps.filter.outputs.docker }}
      dockerfile: ${{ steps.filter.outputs.dockerfile }}
      rust: ${{ steps.filter.outputs.rust }}
      rust_main: ${{ steps.filter.outputs.rust_main }}
      coreml: ${{ steps.filter.outputs.coreml }}
      linux_packages: ${{ steps.filter.outputs.linux_packages }}
      linux_packages_main: ${{ steps.filter.outputs.linux_packages_main }}
      cache_probe: ${{ steps.filter.outputs.cache_probe }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔍 Detect changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Filter design (post-#280):
          # - `code` is the SUPERSET. Anything that should trigger TS unit-tests
          #   sits here. `integration` is a STRICT SUBSET of `code` so whenever
          #   `integration-tests` fires, `unit-tests` is guaranteed to fire too
          #   — the `needs: unit-tests` gate then evaluates predictably without
          #   the skip-propagation hazard that #274 + the pre-rewrite of #280
          #   silently fell into.
          # - `real_engine_e2e` and `tts_e2e` gate model-downloading lanes.
          #   The filters include their narrow TS adapters as well as engine/model
          #   paths: fake/stub tests cannot prove that a changed adapter still
          #   works with a released binary. Both include `rust/**`, so they are
          #   not subsets of `code`; their jobs use an `always()` gate to survive
          #   a legitimately skipped `unit-tests` on rust-only PRs (#274).
          filters: |
            code:
              - 'rust-toolchain.toml'
              - 'src/**'
              # The CLI entry point; docker-image publishes it only after these suites ran on it.
              - 'bin/**'
              - 'tests/**'
              - 'tests/fixtures/**'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.json'
              # `rust/Cargo.toml` is in the SUPERSET filter so the
              # version-drift check (#267 F16) always fires on a
              # Cargo-only version bump PR. Without it, `unit-tests`
              # skipped entirely and the drift merged undetected
              # (Greptile P1 on #315).
              - 'rust/Cargo.toml'
              # Same reason as `rust/Cargo.toml`: a version source (rule 4), so a manifest-only bump must still reach `check:versions`.
              - 'server.json'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
              # workflow-lint's static check can't catch a semantic regression in the guard tests/integration/release-tag-guard.test.ts pins (#1115 review round 2).
              - '.github/workflows/release.yml'
              # tests/unit/security-workflow.test.ts reads it.
              - '.github/workflows/security.yml'
              # tests/unit/nightly.test.ts and the pact rule read it, and it never runs on a pull request.
              - '.github/workflows/nightly.yml'
              # Most of these scripts have unit tests; without this a script-only edit skips the tests that cover it (check-workflows.ts enforces it). Deliberately no count — the one that lived here read 16 against an actual 25.
              - '.github/scripts/**'
              # Same reason for the repo's own scripts: mutate.ts and release-tag.ts both have unit suites, and a scripts-only edit skipped every one of them (#1091 review).
              - 'scripts/**'
              # The two halves of the install-plan join (#920): the size canary's unit test
              # asserts every plan entry still resolves to a URL in the manifest, and a change
              # to either file alone would otherwise never run it.
              - 'model-plan.json'
              # Widened from `rust/src/models/**` in #1132: rust-cross-references.test.ts reads all of rust/src.
              - 'rust/src/**'
              # resolveFile also accepts rust/build.rs and rust/tests/*.rs as reference targets, so a rename there must fire the cross-reference test too (#1132).
              - 'rust/build.rs'
              - 'rust/tests/**'
              # Same reason, and tracked: rust/vendor/vosk-tts/src/*.rs are legal rust/… reference targets too (#1141 review round 1).
              - 'rust/vendor/**'
              # tests/unit/claude-hooks.test.ts checks that every hook settings.json registers is tracked; a hook-only edit must still run it (#1205 review round 1).
              - '.claude/settings.json'
              - '.claude/hooks/**'
            integration:
              - 'src/**'
              - 'tests/integration/**'
              - 'tests/fixtures/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
              - '.github/scripts/install-ffmpeg.sh'
              - '.github/scripts/install-kesha-backend.sh'
              - '.github/scripts/mark-engine-version.ts'
              - '.github/workflows/release.yml'
            real_engine_e2e:
              - 'rust/**'
              - 'package.json'
              - 'bun.lock'
              - 'tests/fixtures/**'
              - 'tests/integration/e2e-engine.test.ts'
              - 'tests/integration/mcp-e2e.test.ts'
              - 'src/engine-install.ts'
              - 'src/engine.ts'
              - 'src/lib.ts'
              - 'src/paths.ts'
              # The download path itself: a revert of the awaited `writer.end()` must re-fire
              # these lanes, and `install.ts` carries the backend pre-flight (#216).
              - 'src/progress.ts'
              - 'src/cli/install.ts'
              - 'src/transcribe.ts'
              - 'src/cli/dispatch.ts'
              - 'src/cli/main.ts'
              - 'src/cli/mcp.ts'
              - 'src/mcp/**'
              - 'tests/integration/say-e2e.test.ts'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
              - '.github/scripts/install-ffmpeg.sh'
              - '.github/scripts/install-kesha-backend.sh'
              - '.github/scripts/smoke-synthesis.ts'
              - '.github/scripts/assert-transcript.ts'
              - '.github/scripts/assert-install-warmup.ts'
              - '.github/scripts/assert-coreml-rejected.sh'
            tts_e2e:
              - 'rust/**'
              - 'package.json'
              - 'bun.lock'
              - 'tests/fixtures/**'
              - 'tests/integration/say-e2e.test.ts'
              - 'tests/integration/mcp-synthesis-e2e.test.ts'
              - 'src/mcp/**'
              - 'src/engine.ts'
              - 'src/synth.ts'
              - 'src/voice-routing.ts'
              - 'src/cli/main.ts'
              - 'src/cli/say.ts'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
              - '.github/scripts/install-ffmpeg.sh'
              - '.github/scripts/install-kesha-backend.sh'
            raycast:
              - 'raycast/**'
              - '.github/workflows/ci.yml'
            openspec:
              - 'openspec/**'
              - 'package.json'
              - '.github/workflows/ci.yml'
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.github/scripts/**'
              - 'package.json'
              - 'bun.lock'
              # The file check:engine-targets guards; without it a size edit never runs the check.
              - 'src/engine-targets.ts'
              # checkFlakeNix (#1088) scans this file; without it here workflow-lint never runs on a flake.nix-only change.
              - 'flake.nix'
              # A ModelFile pin moving out of the filtered set must fire the coverage guard on ITS OWN PR (#950).
              - 'rust/src/**'
            # check:recipes reads the justfile on one side and the prose on the other, so either
            # side moving has to re-run it — renaming a recipe and citing a recipe are the same bug.
            recipes:
              - 'justfile'
              - 'README.md'
              - 'CONTRIBUTING.md'
              - 'CLAUDE.md'
              - 'docs/**'
              - '.claude/**'
              - '.github/workflows/**'
              - '.github/scripts/check-recipes.ts'
              - 'package.json'
            homebrew:
              - 'packaging/homebrew/Formula/**'
              - 'docs/distribution.md'
              - '.github/workflows/ci.yml'
              - '.github/scripts/stage-homebrew-worktree-formula.mjs'
            # What the image packs: a main push that touches it publishes `main`, `sha-*` and `latest`.
            docker:
              - Dockerfile
              - .dockerignore
              - compose.yml
              - package.json
              - bun.lock
              - bin/**
              - src/**
              - tests/fixtures/benchmark/**
              - tests/fixtures/benchmark-en/**
              # The image's tags and build settings live here, as they did in docker.yml's own filter.
              - '.github/workflows/ci.yml'
            # A pull request builds the image only when its recipe changes; src/** alone would build on nearly every PR.
            dockerfile:
              - Dockerfile
              - .dockerignore
              - compose.yml
              - '.github/workflows/ci.yml'
            rust:
              - 'rust/**'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-rust/**'
              - '.github/scripts/pin-msvc-linker.ps1'
              - '.github/scripts/check-coverage.ts'
              - 'package.json'
              - 'bun.lock'
            # What rust-test.yml's push trigger was filtered on: rust-push-gate runs on main only for these.
            rust_main:
              - 'rust/**'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-rust/**'
            # Narrow surface for the ANE decoder-state guard (#592): the
            # FluidAudio backend + its regression test, the coreml feature
            # wiring in Cargo.toml, and Cargo.lock — which pins the exact
            # fluidaudio-rs commit, so a bump (the regression vector) always
            # lands here even though it's a git-branch dep.
            coreml:
              - 'rust/src/backend/fluidaudio.rs'
              # The lane's diagnostics ride KESHA_DEBUG's sink selection (#841).
              - 'rust/src/fluid_stdout.rs'
              # The only lane that *runs* diarize's tests; everything else stops at clippy (#999).
              - 'rust/src/transcribe/diarize.rs'
              - 'rust/build.rs'
              - 'rust/Cargo.toml'
              - 'rust/Cargo.lock'
              - 'tests/fixtures/benchmark-en/03-review-pull-request.ogg'
              - '.github/workflows/ci.yml'
              - '.github/scripts/coreml-regression.sh'
              - '.github/actions/setup-rust/**'
            # release.yml shares this build and publishes it only from a tag, so a PR touching the shared
            # machinery is the last place a broken step can surface before a release depends on it (#728).
            linux_packages:
              - packaging/**
              - .github/scripts/build-linux-packages.mjs
              - .github/scripts/linux-package-names.mjs
              - .github/scripts/install-nfpm.sh
              - .github/scripts/verify-linux-packages.sh
              - .github/actions/linux-packages/action.yml
              - '.github/workflows/ci.yml'
            # On main, everything the packaged CLI is built from.
            linux_packages_main:
              - packaging/**
              - .github/scripts/build-linux-packages.mjs
              - .github/scripts/linux-package-names.mjs
              - .github/scripts/install-nfpm.sh
              - .github/scripts/verify-linux-packages.sh
              - .github/workflows/release.yml
              - .github/actions/setup-bun/action.yml
              - .github/actions/linux-packages/action.yml
              - package.json
              - bun.lock
              - tsconfig.json
              - bin/**
              - src/**
              - README.md
              - docs/distribution.md
              - LICENSE
              - NOTICES.md
              - '.github/workflows/ci.yml'
            cache_probe:
              - .github/workflows/cache-seed.yml
              - .github/actions/install-kesha-backend/action.yml
              - .github/scripts/assert-cross-os-cache.sh
              - '.github/workflows/ci.yml'

  workflow-lint:
    needs: changes
    # `schedule` so a release published after the last workflow change still gets its assets
    # verified within a day, rather than waiting for someone to touch a workflow file.
    if: >-
      needs.changes.outputs.workflows == 'true' || needs.changes.outputs.recipes == 'true'
      || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🍞 Setup Bun workspace
        uses: ./.github/actions/setup-bun

      # check:recipes parses `just --dump`; without a `just` here it fails loudly rather than
      # skipping, which is the point — a silently-skipped gate is the drift it exists to catch.
      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: just@1.58.0

      # Syntax, expression typing and shellcheck of every `run:` (openspec unified-release D5).
      # .github/actionlint.yaml scopes the release.yml queue exception to that workflow only.
      - name: 🧹 Install pinned actionlint
        run: bash .github/scripts/install-actionlint.sh

      - name: 🧹 actionlint
        run: actionlint

      - name: 🔍 Check workflow YAML
        run: bun run check:workflows

      - name: 📖 Check just recipe references
        run: bun run check:recipes

      - name: 🧾 Check release manifest metadata
        run: bun run check:release-manifest

      - name: 🎯 Check engine targets match the published release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run check:engine-targets

  # No path filter: a multi-megabyte binary can land in any directory, and this is the only gate between it and main now that Git LFS is gone.
  file-sizes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🍞 Setup Bun workspace
        uses: ./.github/actions/setup-bun

      - name: ⚖️ Check tracked file sizes
        run: bun run check:file-sizes

  homebrew-formula:
    needs: changes
    if: needs.changes.outputs.homebrew == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🍞 Tap Bun formula
        run: |
          brew tap oven-sh/bun
          # Homebrew Tap-Trust now refuses to load formulae from untrusted
          # taps (the kesha-voice-kit formula depends on oven-sh/bun/bun).
          # Trust the tap so the formula can be loaded below.
          brew trust oven-sh/bun

      - name: 🧪 Create local test tap
        run: brew tap-new local/kesha

      - name: 🔍 Audit formula (as published)
        run: |
          cp packaging/homebrew/Formula/kesha-voice-kit.rb "$(brew --repository local/kesha)/Formula/kesha-voice-kit.rb"
          brew audit --strict --formula local/kesha/kesha-voice-kit

      - name: 🌳 Stage the HEAD archive as the tap formula
        # #924: build a git-archive of HEAD instead of the pinned release tarball, so the
        # install block is exercised against the checkout under review, not a released tree.
        run: node .github/scripts/stage-homebrew-worktree-formula.mjs --tap-dir "$(brew --repository local/kesha)" --archive "$RUNNER_TEMP/kesha-worktree.tar.gz"

      - name: 🔒 Assert brew loads the staged HEAD copy, not the release tag
        # brew test can't tell HEAD from the pinned tag once their versions coincide; assert the
        # rewrite landed so a silently-skipped stage can't false-green the lane (#924).
        run: |
          formula="$(brew --repository local/kesha)/Formula/kesha-voice-kit.rb"
          grep -qE '^  url "file://' "$formula" || { echo "staged formula missing file:// url"; exit 1; }
          ! grep -qE '^  url ".*archive/refs/tags' "$formula" || { echo "staged formula still names the release tag"; exit 1; }

      - name: 📦 Install formula
        run: brew install --build-from-source local/kesha/kesha-voice-kit

      - name: 🚬 Test formula
        run: brew test local/kesha/kesha-voice-kit

      - name: 🧹 Uninstall formula
        if: always()
        run: brew uninstall local/kesha/kesha-voice-kit || true

  unit-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        # 14 unit cases assert only on darwin (#1105) — see docs/decision-log.md before trimming this.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🍞 Setup Bun workspace
        uses: ./.github/actions/setup-bun

      - name: 🔍 Type check
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bunx tsc --noEmit

      - name: 🔢 Check version drift (package.json + Cargo.toml)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bun run check:versions

      - name: 🧪 Unit tests
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: mkdir -p test-results && bun run test:unit --reporter=junit --reporter-outfile="test-results/unit-$MATRIX_OS.xml"

      - name: 📊 Test summary
        if: always()
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: bun .github/scripts/junit-to-markdown.ts "Unit Tests ($MATRIX_OS)" "test-results/unit-$MATRIX_OS.xml" >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/unit-${{ matrix.os }}.xml
          retention-days: 7

      - name: 🪼 Upload to Flakiness.io
        # `if: always()` only guarantees the step runs; it does NOT
        # suppress this step's own exit code. `continue-on-error: true`
        # is what keeps a Flakiness outage / OIDC handshake failure from
        # marking the whole test job red (Greptile #301 P1). Telemetry
        # upload is best-effort, not a release gate.
        if: always()
        continue-on-error: true
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: |
          bun .github/scripts/upload-flakiness.ts \
            "test-results/unit-$MATRIX_OS.xml" bun Laputa/kesha-voice-kit

  ts-coverage:
    needs: [changes, unit-tests]
    if: needs.changes.outputs.code == 'true' && needs.unit-tests.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🍞 Setup Bun workspace
        uses: ./.github/actions/setup-bun

      - name: 📈 Bun coverage
        run: bun run coverage:ts

      - name: 🧯 Enforce TS coverage gates
        run: bun run coverage:check:ts

      - name: 📊 Coverage summary
        if: always()
        shell: bash
        run: |
          if [[ -f coverage/ts/summary.md ]]; then
            cat coverage/ts/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 📤 Upload TS coverage
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-ts
          path: coverage/ts
          retention-days: 30

  integration-tests:
    # FAST lane: runs the full `tests/integration/` suite WITHOUT installing
    # the engine or models. The model-dependent e2e suites
    # (`e2e-engine`, `mcp-e2e`, `say-e2e`) self-skip via
    # `describe.skipIf(!engineInstalled)` when no engine is present, so this
    # lane exercises only the fake/stub-based contract suites
    # (`cli-contracts`, `say`). No `kesha install`, no cache, no
    # download — so it's safe on every PR including release/* branches
    # (no published-engine 404 risk without an install step). Real-engine
    # coverage lives in `integration-tests-full` below, gated to engine/model
    # changes + nightly.
    #
    # Fail-fast: gate on `unit-tests` so a `tsc --noEmit` failure cancels
    # this lane. Safe because `integration` is a strict subset of `code`
    # (see filter design above) — when `integration == 'true'`,
    # `code == 'true'`, so `unit-tests` is never `skipped` here and the
    # standard `result == 'success'` gate is enough.
    needs: [changes, unit-tests]
    if: |
      needs.changes.outputs.integration == 'true' &&
      needs.unit-tests.result == 'success'
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🍞 Setup Bun workspace
        uses: ./.github/actions/setup-bun

      - name: 🧪 Integration tests
        run: mkdir -p test-results && bun run test:integration --reporter=junit --reporter-outfile=test-results/integration.xml
        timeout-minutes: 10

      - name: 📊 Test summary
        if: always()
        run: bun .github/scripts/junit-to-markdown.ts "Integration Tests (macos)" test-results/integration.xml >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-integration
          path: test-results/integration.xml
          retention-days: 7

      - name: 🪼 Upload to Flakiness.io
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          bun .github/scripts/upload-flakiness.ts \
            test-results/integration.xml bun Laputa/kesha-voice-kit

  integration-tests-full:
    # Real-engine integration: installs the ~2.4GB model bundle and runs the
    # model-dependent e2e suites (which self-skip in the fast lane). Gated to
    # engine/model changes, narrow TS engine adapters, push-to-main of those
    # paths, and the nightly cron. Nightly run on main also seeds the
    # default-branch-scoped model cache. Keep the release/* + chore(release)
    # guards: this lane downloads the PUBLISHED engine, which doesn't exist yet
    # during the release version-bump window.
    needs: [changes, unit-tests]
    # `always()` so a SKIPPED `unit-tests` (rust-only PRs have `code == 'false'`)
    # doesn't skip-propagate and drop the heavy lane — `real_engine_e2e` includes
    # `rust/**` but `code` does not, so unit-tests is legitimately skipped on a
    # rust-only PR yet the real-engine e2e must still run (#274 regression class).
    # Still fail-fast if unit-tests actively FAILED/cancelled.
    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.unit-tests.result != 'failure' &&
      needs.unit-tests.result != 'cancelled' &&
      (
        github.event_name == 'schedule' ||
        (
          needs.changes.outputs.real_engine_e2e == 'true' &&
          !startsWith(github.head_ref, 'release/') &&
          !startsWith(github.event.head_commit.message, 'chore(release):')
        )
      )
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      # This lane installs the engine, so self-skipping here is a green run of nothing (#741).
      KESHA_REQUIRE_MODEL_TESTS: "1"
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🍞 Setup Bun workspace
        uses: ./.github/actions/setup-bun
      - name: 🔊 Setup integration backend
        uses: ./.github/actions/install-kesha-backend
        with:
          # Just the engine tree, not the whole cache root. #820 rooted the ~450 MB
          # FluidAudio bundle under `~/.cache/kesha`, so archiving that root would
          # re-mint this entry at ~550 MB on the first main-side miss — no key bump
          # needed, and the budget would move without anyone deciding to. Narrowing
          # the path bounds the entry by construction instead of by discipline.
          #
          # `engine/` is what is worth keeping: the binary, its sidecars and the
          # `.version` marker that gates re-download. The model bundles under
          # `models/` and `fluidaudio/` are not in this entry today and are fetched
          # per run regardless (#741).
          cache-path: |
            ~/.cache/kesha/engine
          cache-key: ${{ runner.os }}-kesha-engine-v1
          # The last cache a pull request could still write. It never does in
          # practice — the restore hits main's entry, so the save is skipped — but
          # on a miss a PR would mint its own ~550 MB copy under its merge ref,
          # which is the eviction pressure #843 removed everywhere else. This lane
          # also runs nightly on main, so it seeds itself and needs no seed job.
          cache-write: ${{ github.event_name != 'pull_request' }}
          cache-restore-keys: ${{ runner.os }}-kesha-engine-
      - name: 🧪 Integration tests (real engine)
        run: mkdir -p test-results && bun run test:integration --reporter=junit --reporter-outfile=test-results/integration-full.xml
        timeout-minutes: 12
      - name: 📊 Test summary
        if: always()
        run: bun .github/scripts/junit-to-markdown.ts "Integration Tests — full (macos)" test-results/integration-full.xml >> "$GITHUB_STEP_SUMMARY"
      - name: 📤 Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-integration-full
          path: test-results/integration-full.xml
          retention-days: 7
      - name: 🪼 Upload to Flakiness.io
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          bun .github/scripts/upload-flakiness.ts \
            test-results/integration-full.xml bun Laputa/kesha-voice-kit

  published-engine-smoke:
    # P1.10: one non-Darwin lane on the published engine; `windows-engine-smoke` is the win32 half (#216).
    needs: [changes, unit-tests]
    # `always()` so a SKIPPED `unit-tests` (rust-only PRs have `code == 'false'`)
    # doesn't skip-propagate and drop the heavy lane — `real_engine_e2e` includes
    # `rust/**` but `code` does not, so unit-tests is legitimately skipped on a
    # rust-only PR yet the real-engine e2e must still run (#274 regression class).
    # Still fail-fast if unit-tests actively FAILED/cancelled.
    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.unit-tests.result != 'failure' &&
      needs.unit-tests.result != 'cancelled' &&
      (
        github.event_name == 'schedule' ||
        (
          needs.changes.outputs.real_engine_e2e == 'true' &&
          !startsWith(github.head_ref, 'release/') &&
          !startsWith(github.event.head_commit.message, 'chore(release):')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KESHA_CACHE_DIR: ${{ github.workspace }}/.kesha-ci-cache
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🍞 Setup Bun workspace
        uses: ./.github/actions/setup-bun

      - name: 🔊 Install published Linux backend
        uses: ./.github/actions/install-kesha-backend
        with:
          cache-path: .kesha-ci-cache
          cache-key: kesha-models-tts-v3
          cache-cross-os: "true"
          ffmpeg-provider: apt
          install-args: --tts en
          engine-dir: .kesha-ci-cache/engine
          install-log: kesha-install.log
          cache-write: "false"

      - name: 🚬 Smoke published Linux engine
        shell: bash
        run: |
          kesha status
          kesha --json tests/fixtures/benchmark-en/01-check-email.ogg > /tmp/kesha-linux-smoke.json
          bun .github/scripts/assert-transcript.ts /tmp/kesha-linux-smoke.json

      # Synthesis was unproven on every non-Darwin platform (#464).
      - name: 🗣️ Synthesis round-trip
        shell: bash
        run: bun .github/scripts/smoke-synthesis.ts /tmp/kesha-linux-synth

  windows-engine-smoke:
    # Cold `kesha install` on purpose: pre-seeding the engine skips `fetchEngineBinary`, where the #216 refusal lived.
    needs: [changes, unit-tests]
    # `always()` so a legitimately skipped `unit-tests` on a rust-only PR doesn't skip-propagate (#274).
    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.unit-tests.result != 'failure' &&
      needs.unit-tests.result != 'cancelled' &&
      (
        github.event_name == 'schedule' ||
        (
          needs.changes.outputs.real_engine_e2e == 'true' &&
          !startsWith(github.head_ref, 'release/') &&
          !startsWith(github.event.head_commit.message, 'chore(release):')
        )
      )
    runs-on: windows-latest
    # Higher than the Linux lane's 12: model downloads are slower on this runner.
    timeout-minutes: 20
    env:
      KESHA_CACHE_DIR: ${{ github.workspace }}/.kesha-ci-cache
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🍞 Setup Bun workspace
        uses: ./.github/actions/setup-bun

      - name: 🔊 Cold install the published Windows engine
        uses: ./.github/actions/install-kesha-backend
        with:
          cache-path: .kesha-ci-cache
          cache-key: kesha-models-tts-v3
          cache-cross-os: "true"
          ffmpeg-provider: skip
          install-args: --tts en
          engine-dir: .kesha-ci-cache/engine
          install-log: kesha-install.log
          cache-write: "false"

      - name: 🔥 Assert the ASR warm-up actually ran
        shell: bash
        run: bun .github/scripts/assert-install-warmup.ts kesha-install.log

      - name: 🚬 Smoke the installed engine
        shell: bash
        run: |
          kesha status
          kesha --json tests/fixtures/benchmark-en/01-check-email.ogg > kesha-win-smoke.json
          bun .github/scripts/assert-transcript.ts kesha-win-smoke.json

      - name: 🗣️ Synthesis round-trip
        shell: bash
        run: bun .github/scripts/smoke-synthesis.ts kesha-win-synth

      - name: 🚫 Reject --coreml on Windows
        shell: bash
        run: bash .github/scripts/assert-coreml-rejected.sh

  release-branch-engine-smoke:
    # P1.11: a release branch cannot download its own engine — the tag does not exist until
    # un-drafting — so build it locally and smoke that instead (#216, #464).
    needs: [changes, unit-tests]
    if: |
      needs.changes.outputs.integration == 'true' &&
      (
        startsWith(github.head_ref, 'release/') ||
        startsWith(github.event.head_commit.message, 'chore(release):')
      ) &&
      needs.unit-tests.result == 'success'
    strategy:
      # A network flake on one platform must not cancel the other's verification.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ffmpeg-provider: apt
            engine-bin: kesha-engine
            timeout: 35
          # Cargo emits the .exe suffix, and a cold MSVC build dominates the job.
          - os: windows-latest
            ffmpeg-provider: skip
            engine-bin: kesha-engine.exe
            timeout: 50
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      KESHA_ENGINE_BIN: ${{ github.workspace }}/rust/target/release/${{ matrix.engine-bin }}
      KESHA_CACHE_DIR: ${{ github.workspace }}/.kesha-ci-cache
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🍞 Setup Bun workspace
        uses: ./.github/actions/setup-bun

      - name: 🦀 Setup Rust
        uses: ./.github/actions/setup-rust

      - name: 🦀 Build local engine
        shell: bash
        run: cd rust && cargo build --release --features portable --no-default-features

      - name: 🧾 Mark local engine version
        shell: bash
        run: bun .github/scripts/mark-engine-version.ts

      # Its own key was restore-only and nothing ever wrote it, so every run cold-downloaded ~3.5GB.
      - name: 🔊 Install models through local backend
        uses: ./.github/actions/install-kesha-backend
        with:
          cache-path: .kesha-ci-cache
          cache-key: kesha-models-tts-v3
          cache-cross-os: "true"
          ffmpeg-provider: ${{ matrix.ffmpeg-provider }}
          install-args: --onnx --tts en
          cache-write: "false"

      - name: 🚬 Smoke release branch local engine
        shell: bash
        run: |
          kesha status
          kesha --json tests/fixtures/benchmark-en/01-check-email.ogg > kesha-release-smoke.json
          bun .github/scripts/assert-transcript.ts kesha-release-smoke.json

      - name: 🗣️ Synthesis round-trip
        shell: bash
        run: bun .github/scripts/smoke-synthesis.ts kesha-release-synth

  tts-e2e:
    # Runs whenever rust engine code, the TS CLI that drives `kesha say`,
    # or the say-e2e test itself changes. Wait for `unit-tests` so a red
    # typecheck/unit lane fail-fasts this expensive macOS TTS lane. Keep
    # `always()` because rust-only PRs have `code == 'false'`, so `unit-tests`
    # is legitimately skipped; those still need the TTS engine coverage that
    # #274 accidentally dropped when relying on normal skip propagation.
    needs: [changes, unit-tests]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.unit-tests.result != 'failure' &&
      needs.unit-tests.result != 'cancelled' &&
      (
        github.event_name == 'schedule' ||
        (
          needs.changes.outputs.tts_e2e == 'true' &&
          !startsWith(github.head_ref, 'release/') &&
          !startsWith(github.event.head_commit.message, 'chore(release):')
        )
      )
    # Pinned (matches release.yml): this is the only CI lane that
    # builds the engine from source on macOS, and macos-latest's floating
    # Xcode 16.4 fails to link (`clang_rt.osx not found`).
    runs-on: macos-14
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🍎 Pin Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "16.2"

      - name: 🍞 Setup Bun workspace
        uses: ./.github/actions/setup-bun

      - name: 🦀 Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          # Flushes caches poisoned before #554, whose build scripts hardcoded Xcode 16.4's clang dir; bump if it resurfaces.
          key: xcode-16.2

      - name: 🦀 Build kesha-engine from source (with TTS)
        env:
          LIBCLANG_PATH: /Library/Developer/CommandLineTools/usr/lib
          RUSTFLAGS: "-L /opt/homebrew/lib"
        run: cd rust && cargo build --release

      # say-e2e asserts only audio *structure* — RIFF, byte count, clean stderr — so it
      # runs against the committed mini stand-in and this lane downloads no weights at
      # all (#741). `rust/tests/mini_model_pact.rs` plus the weekly mini-model-pact
      # workflow are what keep the stand-in's signature honest.
      - name: 🧪 TTS e2e tests
        env:
          KOKORO_MODEL: ${{ github.workspace }}/tests/fixtures/mini-models/kokoro/model.onnx
          KOKORO_VOICE: ${{ github.workspace }}/tests/fixtures/mini-models/kokoro/am_michael.bin
          KESHA_ENGINE_BIN: ${{ github.workspace }}/rust/target/release/kesha-engine
          DYLD_FALLBACK_LIBRARY_PATH: /opt/homebrew/lib
          # This lane stages the stand-in, so a self-skip here would be a green run of
          # nothing — which is exactly how the MCP synthesis case stayed dormant (#857).
          KESHA_REQUIRE_MODEL_TESTS: mini
        run: |
          mkdir -p test-results
          bun test tests/integration/say-e2e.test.ts tests/integration/mcp-synthesis-e2e.test.ts \
            --reporter=junit --reporter-outfile=test-results/tts-e2e.xml

      - name: 📊 Test summary
        if: always()
        run: bun .github/scripts/junit-to-markdown.ts "TTS E2E Tests (macos)" test-results/tts-e2e.xml >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-tts-e2e
          path: test-results/tts-e2e.xml
          retention-days: 7

      - name: 🪼 Upload to Flakiness.io
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          bun .github/scripts/upload-flakiness.ts \
            test-results/tts-e2e.xml bun Laputa/kesha-voice-kit

  raycast-lint:
    needs: changes
    if: needs.changes.outputs.raycast == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: raycast
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📦 Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 26 is what the extension is developed and verified against.
          # Not 20: `@raycast/api` >= 1.104 declares `node >=22.22.2`, so
          # the old pin sat below the supported floor. (26 is Current, not
          # LTS until Oct 2026 — 24 / Krypton is the conservative fallback.)
          node-version: 26
          cache: npm
          cache-dependency-path: raycast/package-lock.json

      - name: 📦 Install
        run: npm ci

      - name: 🔍 Lint (ray lint includes tsc --noEmit)
        run: npm run lint

      - name: 🧪 Test
        run: npm test

  openspec-validate:
    needs: changes
    if: needs.changes.outputs.openspec == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🍞 Setup Bun workspace
        uses: ./.github/actions/setup-bun

      - name: 📐 Validate spec corpus
        env:
          # OpenSpec already disables its PostHog telemetry when CI=true; the
          # explicit opt-out keeps the lane offline if that heuristic changes.
          OPENSPEC_TELEMETRY: '0'
        run: bun run check:specs

  # Moved from docker.yml (openspec unified-release D4); a main push publishes only after the CLI it packs passed its tests; `always()` so a skipped suite does not skip it.
  docker-image:
    needs: [changes, unit-tests, integration-tests]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
      github.event_name == 'push' && needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🔐 Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 🏷️ Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/drakulavich/kesha-voice-kit
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - name: 🧰 Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: 📦 Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Separate from docker-image so a pull request's build holds no packages: write; it only reads the cache (#843).
  docker-rehearsal:
    needs: [changes, unit-tests, integration-tests]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
      github.event_name == 'pull_request' && needs.changes.outputs.dockerfile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🧰 Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: 📦 Build image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha

  # GitHub scopes a cache written during a pull_request run to that PR's merge
  # ref, so it can only ever serve re-runs of the same PR — measured on #838: the
  # first run missed and saved, only later pushes hit. Four such entries at
  # ~300 MB is ~1.2 GB per open PR, and since they are the most recently used,
  # LRU evicts the main-scoped model bundles instead. That is the mechanism
  # behind the parakeet evictions this ticket opened with (#741).
  #
  # So PR runs restore and never save. `rust-push-gate` is the only rust job that
  # runs on main, so it writes the one Linux entry `lint-ubuntu` reads through a
  # matching `shared-key` — that lane gets *warmer* than before, since its first
  # run per PR used to be cold. Lanes with no main-side writer (macOS, Windows,
  # coverage) trade their second-and-later pushes going cold for the headroom;
  # their first push was already cold either way.
  lint-ubuntu:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: linux

      - name: Check formatting
        run: cd rust && cargo fmt -- --check

      - name: Clippy
        run: bash rust/ci/run-clippy.sh Linux

  test:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true'
    permissions:
      contents: read
      # Flakiness.io CLI authenticates via GitHub OIDC; scope the
      # write capability to this job only so a future second job in
      # this workflow doesn't inherit it implicitly (symmetric with
      # the per-job scoping in ci.yml per Greptile #301).
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      KOKORO_CACHE: ${{ github.workspace }}/.kokoro-spike
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      # This lane stages models, so a gate that can't find them is a broken
      # layout, not a laptop — fail instead of skipping to a green run of
      # nothing (#741). `mini` also fails if real weights reappear here, which is
      # what keeps the download from creeping back. Lanes that stage nothing
      # (rust-push-gate) leave it unset.
      KESHA_REQUIRE_MODEL_TESTS: mini
      # Its own flag, not KESHA_REQUIRE_MODEL_TESTS: that promises `mini` here and Silero has no stand-in (#990).
      VAD_CACHE: ${{ github.workspace }}/.vad-cache
      VAD_MODEL: ${{ github.workspace }}/.vad-cache/models/silero-vad/silero_vad.onnx
      KESHA_REQUIRE_VAD_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode 16 (Swift 6)
        if: matrix.os == 'macos-14'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "16.2"
      - uses: ./.github/actions/setup-rust

      # `cargo nextest` replaces `cargo test` for the actual run — it
      # parallelizes per-binary, surfaces flakiness explicitly, and emits
      # JUnit XML via the `ci` profile (see rust/.config/nextest.toml).
      # taiki-e/install-action caches a prebuilt binary per OS/arch so
      # the install is ~1s on warm cache.
      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: nextest

      # Guard against coreml-backend rot: v1.0.0 shipped with broken
      # coreml code because no PR CI job ever tried to build it.
      - name: Check coreml feature
        if: matrix.os == 'macos-14'
        shell: bash
        # --all-targets so the `#[cfg(feature = "coreml")]` tests compile here too (#708).
        run: cd rust && cargo check --features coreml --no-default-features --all-targets

      # The default-feature nextest run (`run-cargo-test.sh`) builds only
      # `onnx,tts`, so the darwin-arm64 FluidAudio paths — `system_kokoro`
      # (#475 `--rate`), `system_diarize`, `system_tts` — and their gated
      # integration tests (`kokoro_rate_e2e.rs`, `diarize_e2e.rs`) never
      # compile in PR CI. The runtime e2e bodies can't run here (the ANE
      # Kokoro model isn't downloaded on the runner; it's a local /
      # release-smoke gate), but `--all-targets` clippy at least type-checks
      # and lints the test code + the install-time voice-pack staging so a
      # darwin-only break is caught before a release tag builds it.
      # The feature set lives in the `verify-darwin-full` recipe, so CI and the local
      # gate cannot drift apart (#797) — hence a `just` on PATH for this lane.
      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        if: matrix.os == 'macos-14'
        with:
          tool: just@1.58.0
      - name: Lint darwin release feature set (incl. system_kokoro)
        if: matrix.os == 'macos-14'
        shell: bash
        run: just verify-darwin-full

      # No model cache on this lane at all: the Kokoro stand-in is committed,
      # CharsiuG2P is covered once on the Linux coverage lane rather than three
      # times, and Vosk-RU left the PR path entirely for the weekly canary (#741).
      - name: 🎚️ Stage Kokoro stand-ins
        shell: bash
        run: bash rust/ci/stage-mini-models.sh "$KOKORO_CACHE"

      # Not actions/cache: 2.3 MB does not repay a PR-scoped entry that only serves re-runs and adds LRU pressure (#741).
      - name: 🔊 Stage Silero VAD
        shell: bash
        run: bash rust/ci/download-vad.sh "$VAD_CACHE"

      - name: Run tests
        shell: bash
        run: bash rust/ci/run-cargo-test.sh "$KOKORO_CACHE" "$RUNNER_OS"

      - name: 📤 Upload JUnit
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-junit-${{ matrix.os }}
          path: rust/target/nextest/ci/junit.xml
          retention-days: 7

      # The npm Flakiness CLI runs everywhere bun runs, so unlike the
      # platform-specific curl installer it covers windows-latest too.
      # Setup-bun is a no-op when bun is already on PATH (cached on warm
      # runs).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: always()
        with:
          bun-version-file: .bun-version

      - name: 🪼 Upload to Flakiness.io
        # `if: always()` runs the step but doesn't suppress its exit
        # code; `continue-on-error: true` keeps a Flakiness outage /
        # OIDC handshake failure off the test-job verdict (Greptile
        # #301 P1). Telemetry upload is best-effort, not a release gate.
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          bun .github/scripts/upload-flakiness.ts \
            rust/target/nextest/ci/junit.xml rust Laputa/kesha-voice-kit

  coverage:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KOKORO_CACHE: ${{ github.workspace }}/.kokoro-spike
      NEXTEST_PROFILE: ci
      KESHA_REQUIRE_MODEL_TESTS: mini
      # CharsiuG2P has no stand-in and its IPA goldens own phoneme fidelity, so this
      # lane still promises it. Vosk-RU moved to nightly.yml's real-model-canary job: one synth test
      # was not worth ~935 MB of per-PR cache, and it needs real weights either way
      # (#741).
      KESHA_REQUIRE_G2P_TESTS: "1"
      VAD_CACHE: ${{ github.workspace }}/.vad-cache
      VAD_MODEL: ${{ github.workspace }}/.vad-cache/models/silero-vad/silero_vad.onnx
      KESHA_REQUIRE_VAD_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No main-side writer for the llvm-cov flavour: its RUSTFLAGS never match push-gate's fingerprints (#741).
      - uses: ./.github/actions/setup-rust
        with:
          extra-components: llvm-tools-preview

      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: nextest

      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: cargo-llvm-cov

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # The only weights left on the PR path that nothing can stand in for:
      # CharsiuG2P, whose phonemiser the Kokoro mini does not replace (#741).
      - name: 🎚️ Setup real TTS models
        uses: ./.github/actions/setup-kokoro-models

      # After the restore, never before: an archive written under an older key still
      # carries a real model.onnx, and unpacking it over a staged stand-in would put
      # this lane back on weights it did not promise.
      - name: 🎚️ Stage Kokoro stand-ins
        shell: bash
        run: bash rust/ci/stage-mini-models.sh "$KOKORO_CACHE"

      # Not actions/cache: 2.3 MB does not repay a PR-scoped entry that only serves re-runs and adds LRU pressure (#741).
      - name: 🔊 Stage Silero VAD
        shell: bash
        run: bash rust/ci/download-vad.sh "$VAD_CACHE"

      - name: 📈 Rust coverage
        shell: bash
        run: |
          source rust/ci/kokoro-env.sh "$KOKORO_CACHE"
          bun run coverage:rust

      - name: 📤 Upload Ubuntu JUnit
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-junit-ubuntu-latest
          path: rust/target/nextest/ci/junit.xml
          retention-days: 7

      - name: 🪼 Upload Ubuntu tests to Flakiness.io
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          bun .github/scripts/upload-flakiness.ts \
            rust/target/nextest/ci/junit.xml rust Laputa/kesha-voice-kit

      - name: 🧯 Enforce Rust coverage gates
        run: bun run coverage:check:rust

      - name: 📊 Coverage summary
        if: always()
        shell: bash
        run: |
          if [[ -f coverage/rust/summary.md ]]; then
            cat coverage/rust/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 📤 Upload Rust coverage
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-rust
          path: coverage/rust
          retention-days: 30

  rust-push-gate:
    # Lean post-merge gate: catches semantic merge conflicts (two PRs green
    # alone, broken together) fast and cheap. The 3-OS matrix already ran on
    # the PR; release.yml is the cross-platform release gate. Ubuntu-only
    # on purpose.
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.rust_main == 'true'
    permissions:
      # A job-level block replaces the inherited grant, so omitting this breaks checkout.
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Sole rust job on main, so this is the entry `lint-ubuntu` restores.
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: linux
      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: nextest
      - name: Check formatting
        run: cd rust && cargo fmt -- --check
      - name: Clippy
        run: bash rust/ci/run-clippy.sh Linux
      - name: Tests
        # `--profile ci` is what emits target/nextest/ci/junit.xml for the upload below.
        run: cd rust && cargo nextest run --profile ci --features tts

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: always()
        with:
          bun-version-file: .bun-version

      - name: 🪼 Upload to Flakiness.io
        # Gives main a Rust baseline so flip/fail rates have history to compute against.
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          bun .github/scripts/upload-flakiness.ts \
            rust/target/nextest/ci/junit.xml rust Laputa/kesha-voice-kit

  # Provisioned macOS arm64 lane for the FluidAudio TDT decoder-state guard
  # (#592). `transcribe_samples_is_stateless_across_calls` is `#[ignore]` +
  # `coreml`-only because it needs a real Apple Neural Engine AND the cached
  # Parakeet CoreML bundle — the per-PR macos-14 lane above only *compiles*
  # `coreml` (`cargo check`), so a fluidaudio-rs bump that dropped the upstream
  # stateless-reset fix (FluidInference/fluidaudio-rs#15) would ship the
  # multi-segment "." corruption with no automated failure.
  #
  # Runs only when the regression surface changes (the `coreml` paths-filter:
  # the FluidAudio backend, the coreml feature wiring, or the fluidaudio-rs pin
  # in Cargo.lock) — not on every PR and not nightly. The CoreML Parakeet
  # bundle is large but cached, so the fetch is a once-per-key seed.
  #
  # macos-14 is GitHub-hosted Apple Silicon, but it is an `Apple M1 (Virtual)` VM
  # with **no** Neural Engine (#742 measured `ioreg -c AppleARMIODevice | grep -ci
  # ane` at 0 there against 32 on a real M2), so the ANE-converted Parakeet chain
  # actually executes through BNNS on the CPU. The guard still catches a
  # fluidaudio-rs bump that drops the stateless-reset fix, which is what #592
  # asked of it; it just does not exercise the ANE.
  coreml-regression:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.coreml == 'true'
    runs-on: macos-14
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      NEXTEST_PROFILE: ci
      # The Swift bridge collapses every transcribe throw to "Transcription
      # failed" and prints the real error with `print`, i.e. onto the stdout the
      # backend silences. Debug routes that sink to stderr so #841's warm-cache
      # failure names its own cause (#678 does the same for darwin synthesis).
      KESHA_DEBUG: "1"
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode 16 (Swift 6)
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "16.2"
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: nextest

      # Restore-only: this job runs on pull_request, and GitHub scopes a cache to
      # the ref that wrote it, so anything saved here is readable by re-runs of
      # this PR alone — never by main, never by another PR (#675, the defect #663
      # fixed for Kokoro). cache-seed.yml writes this key from main instead.
      # On a miss the bundle is still fetched during the test's `init_asr()`;
      # the run is slower, not wrong.
      - name: 🎧 Restore Parakeet CoreML models
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Must track `models::fluidaudio_asr_location`. A runner has no legacy bundle, so
          # the engine roots it under the Kesha cache; caching the old Application Support
          # path would restore where nothing reads and save where nothing wrote (#688).
          path: ~/.cache/kesha/fluidaudio/parakeet-tdt-0.6b-v3
          # Keyed on the fluidaudio-rs pin (Cargo.lock): a bump changes the model
          # set. The prefix restore-key warm-starts from the prior bundle so a
          # bump tops up the delta instead of re-fetching everything.
          key: parakeet-coreml-models-v2-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            parakeet-coreml-models-v2-${{ runner.os }}-

      - name: 🧪 CoreML decoder-state regression
        run: bash .github/scripts/coreml-regression.sh

      - name: 📤 Upload JUnit
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-junit-coreml-regression
          path: rust/target/nextest/ci/junit.xml
          retention-days: 7

  # The second required status check, kept under its old name when rust-test.yml moved in
  # (openspec unified-release D4). Always runs so the context reports on every PR (the heavy
  # jobs above skip on non-rust PRs → success); the step fails the gate only if a real job
  # failed. `coreml-regression` is included so a red decoder-state guard blocks a PR that
  # touches the regression surface (it reports 'skipped' — not 'failure' — on PRs that
  # don't, so it never blocks unrelated work). `rust-push-gate` runs on main only, where a
  # red one now reds this check instead of nothing.
  rust-tests:
    name: 🧪 Rust Tests
    if: always()
    needs: [changes, lint-ubuntu, test, coverage, coreml-regression, rust-push-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
  # CI only. The packages users install are cut from a stable tag by release.yml (#728).
  linux-packages:
    needs: changes
    if: >-
      (github.event_name == 'pull_request' && needs.changes.outputs.linux_packages == 'true')
      || (github.event_name == 'push' && needs.changes.outputs.linux_packages_main == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and verify packages
        uses: ./.github/actions/linux-packages

  # Proves, in bytes rather than in prose, where a cross-OS cache entry lands on Windows.
  #
  # `kesha-models-tts-v3` is one entry shared by the Linux and Windows model lanes (#860). That only
  # works because its `path:` is workspace-relative. A cross-OS archive stores members relative to
  # GITHUB_WORKSPACE and extracts them the same way, with no remap to the consumer's home — so a
  # `~/.cache/kesha` entry saved on Linux extracts beside the Windows workspace root, nowhere near
  # %USERPROFILE%, **while still reporting a cache hit**. The lane would then cold-download 2.8 GB
  # behind a green "Cache restored from key" line: the dedup silently buys nothing on half the target.
  #
  # Two arms, one run, so the contrast is evidence and not an argument:
  #   workspace-relative → the file MUST be under the Windows workspace
  #   home-anchored      → the file MUST NOT be under the Windows home
  # Both restores are asserted to HIT first, which is the whole point: a hit says nothing about placement.
  #
  # Entries are a few bytes and deleted at the end, so this never competes for the 10 GB budget.
  cache-probe-save:
    name: Save both probe entries (ubuntu)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.cache_probe == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WORKSPACE_KEY: kesha-crossos-probe-workspace-${{ github.run_id }}-${{ github.run_attempt }}
      HOME_KEY: kesha-crossos-probe-home-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Relative, not $GITHUB_WORKSPACE: under Git Bash that variable carries backslashes, which
      # bash mangles inside quotes. Every step already runs with the workspace as its cwd.
      - name: Stage both probe trees
        run: |
          mkdir -p .kesha-ci-cache-probe ~/.kesha-probe-home
          printf kesha-cross-os-probe > .kesha-ci-cache-probe/probe.txt
          printf kesha-cross-os-probe > ~/.kesha-probe-home/probe.txt

      - name: Save the workspace-relative entry
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .kesha-ci-cache-probe
          key: ${{ env.WORKSPACE_KEY }}
          enableCrossOsArchive: true

      - name: Save the home-anchored entry
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.kesha-probe-home
          key: ${{ env.HOME_KEY }}
          enableCrossOsArchive: true

  cache-probe-restore:
    name: Restore both on windows and check placement
    needs: cache-probe-save
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      WORKSPACE_KEY: kesha-crossos-probe-workspace-${{ github.run_id }}-${{ github.run_attempt }}
      HOME_KEY: kesha-crossos-probe-home-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore the workspace-relative entry
        id: workspace
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .kesha-ci-cache-probe
          key: ${{ env.WORKSPACE_KEY }}
          enableCrossOsArchive: true

      - name: Restore the home-anchored entry
        id: home
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.kesha-probe-home
          key: ${{ env.HOME_KEY }}
          enableCrossOsArchive: true

      # Both must hit, or the placement assertions below would pass for the wrong reason.
      - name: Both entries must report a cache hit
        env:
          WORKSPACE_HIT: ${{ steps.workspace.outputs.cache-hit }}
          HOME_HIT: ${{ steps.home.outputs.cache-hit }}
        run: |
          echo "workspace-relative hit=$WORKSPACE_HIT   home-anchored hit=$HOME_HIT"
          test "$WORKSPACE_HIT" = "true" && test "$HOME_HIT" = "true"

      - name: Show where each archive actually landed
        run: |
          echo "cwd=$(pwd)  home=$HOME"
          find . "$HOME" -maxdepth 6 -name probe.txt 2>/dev/null || true

      - name: The workspace-relative entry lands in the workspace
        run: bash .github/scripts/assert-cross-os-cache.sh present .kesha-ci-cache-probe/probe.txt workspace-relative

      - name: The home-anchored entry does not land in the home dir
        run: bash .github/scripts/assert-cross-os-cache.sh absent "$HOME/.kesha-probe-home/probe.txt" home-anchored

  cache-probe-cleanup:
    name: Delete the probe entries
    needs: [cache-probe-save, cache-probe-restore]
    if: always() && needs.cache-probe-save.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      WORKSPACE_KEY: kesha-crossos-probe-workspace-${{ github.run_id }}-${{ github.run_attempt }}
      HOME_KEY: kesha-crossos-probe-home-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Drop both keys
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for key in "$WORKSPACE_KEY" "$HOME_KEY"; do
            gh api --method DELETE "/repos/$REPO/actions/caches?key=$key" || echo "no entry for $key"
          done

  # Aggregator gate = the single required status check for branch protection.
  # Always runs so 🧪 CI reports on every PR; the path-gated jobs above skip on
  # unrelated PRs (→ success). The step fails the gate only if a real job failed.
  ci:
    name: 🧪 CI
    if: always()
    needs:
      - changes
      - workflow-lint
      - file-sizes
      - homebrew-formula
      - unit-tests
      - ts-coverage
      - integration-tests
      - integration-tests-full
      - published-engine-smoke
      - windows-engine-smoke
      - release-branch-engine-smoke
      - tts-e2e
      - raycast-lint
      - openspec-validate
      - docker-image
      - docker-rehearsal
      - linux-packages
      - cache-probe-save
      - cache-probe-restore
      - cache-probe-cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
