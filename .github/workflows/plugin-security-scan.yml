# HOL plugin scanner, the check awesome-ai-plugins runs on every listing
# (hashgraph-online/awesome-ai-plugins#291). Same pinned action as the
# catalog sweep; contents: read only, no secrets, credentials not persisted.
name: "🛡️ Plugin Security Scan"

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🔍 Scan
        uses: hashgraph-online/ai-plugin-scanner-action@1c7b18e191376dd17550d4bff41fd8c9f71e4ca8 # v1.2.691
        with:
          plugin_dir: "."
          min_score: 80
          fail_on_severity: high
