name: "🔨 Build Engine"

on:
  push:
    # Match real engine-release tags ("v1.0.2") and prerelease engine tags
    # ("v1.0.3-beta.1"), but skip CLI-only marker tags ("v1.0.8-cli").
    # CLI-only patches do not rebuild the Rust engine — a separate marker
    # release is created manually via `gh release create v<X.Y.Z>-cli
    # --notes-file ...` without triggering this workflow. See CLAUDE.md →
    # RELEASE PROCESS.
    tags:
      - "v*"
      - "!v*-cli"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create + build (e.g. v1.17.0 or v1.17.1-beta.1). Leave empty to build-only from `ref`."
        required: false
      ref:
        description: "Git ref to tag from (commit SHA, branch). Defaults to main HEAD."
        required: false
        default: "main"
      notes:
        description: "Release notes body (Markdown). Stored as the annotated tag message; the release job reads it back to populate the draft body."
        required: false

permissions:
  contents: write

concurrency:
  # Never cancel a run mid-upload: the release job would leave the draft short an asset (#1108).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    shell: bash

jobs:
  # Lets sandboxed automation cut a release without local tag-push rights (#306).
  tag:
    if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write # for the self-dispatch below (#651)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      # Inline, not a script: this job runs from `inputs.ref`, which may predate any new script. `-cli` marker tags are the CLI's (#685).
      - name: Validate tag shape and uniqueness
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(beta|alpha)\.[0-9]+)?$ ]] || { echo "::error::Tag '$INPUT_TAG' must match vX.Y.Z, vX.Y.Z-beta.N or vX.Y.Z-alpha.N (CLI marker tags ending in -cli are not supported by this workflow)"; exit 1; }
          if git rev-parse "refs/tags/$INPUT_TAG" >/dev/null 2>&1; then echo "::error::Tag $INPUT_TAG already exists. Tag names are one-use (CLAUDE.md → TAG NAMES ARE ONE-USE) — bump patch and retry."; exit 1; fi
          echo "Tag $INPUT_TAG passes shape + uniqueness checks."

      # `inputs.tag` and `inputs.notes` flow through `env:` rather than direct
      # `${{ … }}` interpolation in the run: script. The workflow holds
      # `contents: write`; an attacker-controlled value containing `$(cmd)` or
      # `;` would otherwise execute arbitrary code with that permission. Pattern
      # mirrors `.github/workflows/npm-publish.yml::Resolve tag` (post-#291).
      - name: Create and push annotated tag
        env:
          TAG: ${{ inputs.tag }}
          INPUT_NOTES: ${{ inputs.notes }}
        run: printf '%s' "$INPUT_NOTES" | .github/scripts/push-annotated-tag.sh

      # A GITHUB_TOKEN push never fires `on.push.tags`; workflow_dispatch is the exception (#651).
      - name: Trigger build + release for the new tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build-engine.yml --ref "$INPUT_TAG"
          echo "Dispatched build + release against $INPUT_TAG."

  build:
    # The tag-creating run has no `release` job to consume a build (#306).
    if: github.event_name != 'workflow_dispatch' || inputs.tag == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          # system_tts (#141) adds the AVSpeechSynthesizer backend via a
          # Swift sidecar. kesha install places the sidecar next to the
          # engine binary; runtime lookup is sibling-first (see
          # rust/src/tts/avspeech.rs::helper_path).
          # system_kokoro (#207) and system_diarize (#199) add Kokoro TTS and
          # Sortformer diarization in-engine via the native fluidaudio-rs
          # binding — no separate Swift sidecars (unlike AVSpeech / text-lang).
          - os: macos-14
            target: aarch64-apple-darwin
            features: darwin
            binary: kesha-engine-darwin-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: portable
            binary: kesha-engine-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            features: portable
            binary: kesha-engine-windows-x64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # Target macOS 14 so the Swift compiler treats concurrency as
      # OS-provided and does not emit an explicit @rpath dependency on
      # libswift_Concurrency.dylib (which no longer ships as a standalone
      # file on macOS 26+).
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      # Points the CLI at the staged artifact for the pre-upload smoke, as release-branch-engine-smoke does (#671).
      KESHA_ENGINE_BIN: ${{ github.workspace }}/${{ matrix.binary }}
      KESHA_CACHE_DIR: ${{ github.workspace }}/.kesha-ci-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode 16 (Swift 6)
        if: matrix.os == 'macos-14'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "16.2"
      # Every matrix target is its runner's host triple, which rustup installs with the toolchain.
      - uses: ./.github/actions/setup-rust
        with:
          save-if: "true"

      # Without this the binary reports the pinned release it is meant to be tested against (#685).
      - name: Apply the alpha engine version
        if: startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-alpha.')
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: node .github/scripts/set-cargo-version.mjs "${TAG_NAME#v}"

      - name: Build release binary
        shell: bash
        env:
          ENGINE_TARGET: ${{ matrix.target }}
          ENGINE_FEATURES: ${{ matrix.features }}
        run: cd rust && cargo build --release --target "$ENGINE_TARGET" --features "$ENGINE_FEATURES" --no-default-features
      - name: Prepare artifact
        shell: bash
        env:
          ENGINE_TARGET: ${{ matrix.target }}
          RUNNER_IMAGE: ${{ matrix.os }}
          ENGINE_BINARY: ${{ matrix.binary }}
        run: |
          src="rust/target/$ENGINE_TARGET/release/kesha-engine"
          if [ "$RUNNER_IMAGE" = "windows-latest" ]; then src="${src}.exe"; fi
          cp "$src" "$ENGINE_BINARY"

      # system_tts (#141): the Swift AVSpeechSynthesizer sidecar lives in the build script's OUT_DIR.
      - name: Stage AVSpeech sidecar (macOS)
        if: matrix.os == 'macos-14'
        shell: bash
        env:
          ENGINE_TARGET: ${{ matrix.target }}
        run: bash .github/scripts/stage-darwin-sidecar.sh say-avspeech "system_tts feature may not have compiled"

      # NOTE: Kokoro TTS (#207) and Sortformer diarization (#199) no longer
      # ship as Swift sidecars — both run in-engine via native fluidaudio-rs,
      # so there is nothing to stage for them here (the engine binary carries
      # the feature; the diarization model is fetched by `kesha install
      # --diarize`).

      # detect-text-lang fast-path sidecar: replaces the per-call `swift -e`
      # shell-out. Always built on macOS by `rust/build.rs::build_text_lang_helper`
      # (no feature gate; `text_lang` itself is macOS-only at runtime).
      - name: Stage kesha-textlang sidecar (macOS)
        if: matrix.os == 'macos-14'
        shell: bash
        env:
          ENGINE_TARGET: ${{ matrix.target }}
        run: bash .github/scripts/stage-darwin-sidecar.sh kesha-textlang "build.rs::build_text_lang_helper may have failed"

      - name: Smoke-test binary
        shell: bash
        env:
          ENGINE_BINARY: ${{ matrix.binary }}
          RUNNER_IMAGE: ${{ matrix.os }}
        run: bash .github/scripts/smoke-engine-binary.sh

      # The smoke above proves the artifact starts and advertises `tts`, not that it synthesises (#671, #636).
      # darwin synthesises in `darwin-synthesis-smoke` instead — macos-14's CoreML cannot run the vocoder (#678).
      - name: 🍞 Setup Bun workspace
        if: matrix.os != 'macos-14'
        uses: ./.github/actions/setup-bun

      - name: 🔗 Link the CLI
        if: matrix.os != 'macos-14'
        shell: bash
        run: bun link

      # Load-bearing: on a version mismatch `installEngine` fetches the published engine, whose tag does not exist yet.
      - name: 🧾 Mark staged engine version
        if: matrix.os != 'macos-14'
        shell: bash
        run: bun .github/scripts/mark-engine-version.ts

      - name: 🔊 Install English TTS models
        if: matrix.os != 'macos-14'
        uses: ./.github/actions/install-kesha-backend
        with:
          cache-path: .kesha-ci-cache
          cache-key: kesha-models-tts-v3
          cache-cross-os: "true"
          ffmpeg-provider: skip
          install-args: --tts en
          cache-write: "false"

      - name: 🗣️ Pre-upload synthesis smoke
        if: matrix.os != 'macos-14'
        shell: bash
        run: bun .github/scripts/smoke-synthesis.ts --no-roundtrip synthesis-smoke

      - name: Inspect macOS dynamic deps
        if: matrix.os == 'macos-14'
        shell: bash
        env:
          ENGINE_BINARY: ${{ matrix.binary }}
        run: otool -L "$ENGINE_BINARY" && otool -l "$ENGINE_BINARY" | grep -A2 LC_RPATH || true

      - name: Upload engine artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}

      - name: Upload AVSpeech sidecar (macOS)
        if: matrix.os == 'macos-14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: say-avspeech-darwin-arm64
          path: say-avspeech-darwin-arm64

      - name: Upload kesha-textlang sidecar (macOS)
        if: matrix.os == 'macos-14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kesha-textlang-darwin-arm64
          path: kesha-textlang-darwin-arm64

  # Exercises the macos-14 artifact elsewhere: that image is required to build, and its CoreML cannot
  # run the vocoder — the image's CoreML version, not its missing ANE, which #678 measured and refuted.
  # Hosted macOS runners are VMs with no Neural Engine, so CoreML runs Kokoro through libBNNS on the
  # CPU, where a shape-proportional stack allocation overflows the dispatch worker's 512 KB stack and
  # the process takes SIGBUS (#742). Length is only a proxy for that shape, and not a monotonic one:
  # prefixes of the default pangram survive to 31 chars, die at 32-33, survive again at 34-37, and die
  # from 38 on. So do not swap in another "short enough" sentence — this one was measured 20/20 clean
  # on a runner. Long-utterance Kokoro/CoreML stays uncovered; AVSpeech carries the full sentence.
  darwin-synthesis-smoke:
    name: Darwin synthesis smoke
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    env:
      KESHA_ENGINE_BIN: ${{ github.workspace }}/kesha-engine-darwin-arm64
      # FluidAudio reports CoreML failures on stdout, which the bridge guard discards; this routes them to stderr (#678).
      KESHA_DEBUG: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kesha-engine-darwin-arm64

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: say-avspeech-darwin-arm64

      # The artifact carries the release asset name; `tts::avspeech::helper_path` probes for a
      # `say-avspeech` sibling of the engine, and on a tag cut `kesha install` cannot top that up
      # from a release which does not exist yet — so this lane has to stage it itself (#678).
      - name: Restore the executable bits upload-artifact drops
        shell: bash
        run: |
          cp -f say-avspeech-darwin-arm64 say-avspeech
          chmod +x kesha-engine-darwin-arm64 say-avspeech-darwin-arm64 say-avspeech

      - name: 🍞 Setup Bun workspace
        uses: ./.github/actions/setup-bun

      - name: 🔗 Link the CLI
        shell: bash
        run: bun link

      # Load-bearing: on a version mismatch `installEngine` fetches the published engine, whose tag does not exist yet.
      - name: 🧾 Mark staged engine version
        shell: bash
        run: bun .github/scripts/mark-engine-version.ts

      # FluidAudio owns `~/.cache/fluidaudio` — the ANE voice packs install stages, plus the bundle it self-fetches.
      # Left out of the `kesha-models-tts-v3` share on purpose: this row caches a second path the other
      # lanes do not, so it cannot read their entry. Staying per-OS also keeps it off the cross-OS rules —
      # a same-OS archive restores to the home dir it was saved from. cache-seed.yml's `kesha-models-darwin`
      # is the only writer of this key; path, key and archive mode must stay identical on both sides or
      # the restore silently misses, which is how it went a year cold-downloading (#877).
      - name: 🔊 Install English TTS models
        uses: ./.github/actions/install-kesha-backend
        with:
          cache-path: |
            ~/.cache/kesha
            ~/.cache/fluidaudio
          cache-key: ${{ runner.os }}-kesha-models-tts-v1
          cache-restore-keys: ${{ runner.os }}-kesha-models-tts-
          ffmpeg-provider: skip
          install-args: --tts en
          cache-write: "false"

      - name: 🗣️ Synthesis smoke — Kokoro
        shell: bash
        run: bun .github/scripts/smoke-synthesis.ts --no-roundtrip --text "Kesha speaks." synthesis-smoke

      # The other engine a macOS build ships, and the one this lane downloaded the sidecar for
      # without ever routing through it (#678). AVSpeech needs no accelerator, so it carries the
      # full sentence Kokoro cannot. `macos-en-US` resolves through AVSpeechSynthesisVoice(language:),
      # so no per-image voice identifier can go missing under us. Runs even when the arm above is
      # red — they exercise different engines, and one failing must not hide the other's result.
      - name: 🗣️ Synthesis smoke — AVSpeech sidecar
        if: ${{ !cancelled() }}
        shell: bash
        run: bun .github/scripts/smoke-synthesis.ts --no-roundtrip --voice macos-en-US avspeech-smoke

  # Gating on the darwin smoke as well as the matrix is what makes it a gate over artifacts rather
  # than run colour (#737): a red smoke has to stop the draft below, and the alpha auto-publish with
  # it. Accepted tradeoff — the pinned sentence measured 20/20, so a failure here is environment
  # drift that should hold the release until a human looks (#742).
  release:
    needs: [build, darwin-synthesis-smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      # Need the tag object available locally to read its annotation. Default
      # actions/checkout doesn't fetch tag objects under `on.push.tags`, so
      # `fetch-tags: true` is explicit. The `tag` job (fix #306) writes the
      # release notes into the annotated tag's message; this checkout + the
      # extract step below recover it. A lightweight tag (manual
      # `git tag vX.Y.Z` from a laptop, no `-a`) has no annotation to recover —
      # `%(contents)` returns the *commit* message there, so the extract step
      # gates on `git cat-file -t` and drops it rather than publishing it (#815).
      - name: Checkout at tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-tags: true
          fetch-depth: 0

      - name: Prepare release notes from tag annotation
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: node .github/scripts/engine-release-notes.mjs > release-notes.md

      - name: Prepare release asset directory
        run: mkdir -p release-assets

      - name: Classify release tag
        id: release_kind
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: node .github/scripts/classify-release-tag.mjs "$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Generate source SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: release-assets/kesha-voice-kit-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Setup Bun workspace
        uses: ./.github/actions/setup-bun

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: release-assets

      - name: Generate release manifest
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: node .github/scripts/release-manifest.mjs --tag "$TAG_NAME" --out release-assets/kesha-release-manifest.json

      - name: Generate release checksums
        shell: bash
        run: bash .github/scripts/release-checksums.sh release-assets

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release assets
        shell: bash
        run: bash .github/scripts/sign-release-assets.sh release-assets

      # Runs last, right before GitHub resolves the tag to whatever commit it names now — a re-point during the SBOM/download/sign window above is the same #1108/#1115 bug moved later (review round 3, Greptile P1); querying origin live and peeling `^{}` avoids both the stale-local-ref and tag-object-vs-commit traps (round 2 P1/P2), though a same-commit re-annotation still passes.
      - name: Verify tag has not been superseded
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          current="$(git ls-remote origin "refs/tags/$TAG_NAME" "refs/tags/$TAG_NAME^{}" | tail -1 | cut -f1)"
          [ "$current" = "$GITHUB_SHA" ] || { echo "::error::tag $TAG_NAME now points at $current, but this run was triggered for $GITHUB_SHA — the tag was re-pointed mid-build. Refusing to publish a release built from a superseded commit."; exit 1; }

      # Always a draft: releases here are immutable, and an asset uploaded after publication 422s.
      - name: Create draft release with binaries
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
          files: release-assets/*
          draft: true
          prerelease: ${{ steps.release_kind.outputs.prerelease }}

      # Stable and beta wait for the human un-draft gate; an alpha nobody can install is not one (#685).
      - name: Publish the alpha
        if: steps.release_kind.outputs.publish == 'true'
        env:
          TAG_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG_NAME" --draft=false
