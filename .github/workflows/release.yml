name: "🚀 Release"

# One workflow for every Channel (openspec unified-release D2); alpha tags are records written by this workflow, never triggers.
on:
  push:
    tags:
      - "v*"
      - "!v*-alpha.*"
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: "Prerelease to publish: beta (needs version) or alpha (version derived)"
        required: true
        type: choice
        options: [beta, alpha]
      version:
        description: "Beta only: X.Y.Z-beta.N extending package.json#version"
        required: false
        default: ""
      engine-prerelease:
        description: "Alpha only: publish the CLI against this Engine prerelease tag (vX.Y.Z-beta.N or -alpha.N) and build no Engine"
        required: false
        default: ""
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/actions/setup-rust/**
      - .github/actions/install-kesha-backend/**
      - .github/actions/prepare-npm-package/**
      - .github/scripts/release-classify.ts
      - .github/scripts/check-release-assets.ts
      - .github/scripts/release-install-smoke.sh
      - .github/scripts/smoke-engine-binary.sh
      - .github/scripts/smoke-synthesis.ts
      - .github/scripts/stage-darwin-sidecar.sh
      - .github/scripts/mark-engine-version.ts
      - .github/scripts/set-cargo-version.mjs
      - .github/scripts/release-manifest.mjs
      - .github/scripts/release-checksums.sh
      - .github/scripts/sign-release-assets.sh
      - .github/scripts/engine-release-notes.mjs
      - .github/scripts/publish-release.sh
      - .github/scripts/engine-pin.ts
      - .github/scripts/npm-pack-verify.ts
      - .github/scripts/set-package-version.mjs
      - .github/scripts/release-plan.ts
      - .github/scripts/alpha-publishable.ts
      - .github/scripts/alpha-requested.sh
      - .github/scripts/alpha-tag.sh
      - .github/scripts/changed-paths.sh
      - .github/actions/linux-packages/**
      - src/package-info.ts
      - src/engine-install.ts
      - src/engine-targets.ts

permissions:
  contents: read

# Never cancelled: a run killed mid-upload leaves an immutable release short an asset; rehearsals queue per PR, off the publish lane.
concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  queue: max

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    shell: bash

jobs:
  classify:
    name: Classify the trigger
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      path: ${{ steps.classify.outputs.path }}
      channel: ${{ steps.classify.outputs.channel }}
      version: ${{ steps.classify.outputs.version }}
      tag: ${{ steps.classify.outputs.tag }}
      prerelease: ${{ steps.classify.outputs.prerelease }}
      dist_tag: ${{ steps.classify.outputs.dist_tag }}
      build_engine: ${{ steps.classify.outputs.build_engine }}
      json: ${{ steps.classify.outputs.json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # Refs reach the script through `env:` (#291); it prints the outputs itself, so a crafted ref cannot add keys.
      - name: Classify
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_ENGINE_PRERELEASE: ${{ inputs.engine-prerelease }}
        run: bun .github/scripts/release-classify.ts >> "$GITHUB_OUTPUT"

  # Every run passes through here; only an alpha consults the tags, the label and the published Engines.
  plan:
    name: Plan the publish
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      engine_version: ${{ steps.plan.outputs.engine_version }}
      publish: ${{ steps.plan.outputs.publish }}
      previous: ${{ steps.plan.outputs.previous }}
    steps:
      # The alpha sequence is counted from tags; a shallow checkout looks like a repository with none.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/setup-bun
      - name: Changed paths
        if: needs.classify.outputs.path == 'cli-alpha'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: .github/scripts/changed-paths.sh
      - name: Is the change publishable
        id: packed
        if: needs.classify.outputs.path == 'cli-alpha'
        run: bun .github/scripts/alpha-publishable.ts < changed-paths.txt >> "$GITHUB_OUTPUT"
      # The `alpha` label is the intent, the packed-path check the safety net (#685).
      - name: Did the merged PR ask for an alpha
        id: requested
        if: needs.classify.outputs.path == 'cli-alpha'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          MANUAL: "false"
          PACKED: ${{ steps.packed.outputs.publish }}
        run: .github/scripts/alpha-requested.sh >> "$GITHUB_OUTPUT"
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CLASSIFICATION: ${{ needs.classify.outputs.json }}
          PUBLISHABLE: ${{ steps.requested.outputs.publish }}
          ENGINE_PRERELEASE: ${{ inputs.engine-prerelease }}
        run: bun .github/scripts/release-plan.ts >> "$GITHUB_OUTPUT"

  # Before the npm publish, not after: npm holding a version no tag records lets the next derivation reuse it.
  reserve-tag:
    name: Reserve the alpha tag
    needs: [classify, plan]
    if: needs.plan.outputs.publish == 'true' && needs.classify.outputs.build_engine == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Tag the built commit
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ github.sha }}
          PREVIOUS: ${{ needs.plan.outputs.previous }}
        run: .github/scripts/alpha-tag.sh

  build:
    name: Build Engine (${{ matrix.binary }})
    needs: [classify, plan]
    if: needs.classify.outputs.build_engine == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            features: darwin
            binary: kesha-engine-darwin-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: portable
            binary: kesha-engine-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            features: portable
            binary: kesha-engine-windows-x64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # macOS 14 keeps Swift concurrency OS-provided: no @rpath libswift_Concurrency.dylib, which macOS 26+ no longer ships.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      KESHA_ENGINE_BIN: ${{ github.workspace }}/${{ matrix.binary }}
      KESHA_CACHE_DIR: ${{ github.workspace }}/.kesha-ci-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode 16 (Swift 6)
        if: matrix.os == 'macos-14'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "16.2"
      - uses: ./.github/actions/setup-rust
        with:
          save-if: ${{ github.event_name != 'pull_request' }}

      # `kesha-engine --version` reports CARGO_PKG_VERSION; a prerelease no commit carries is applied here (#685).
      - name: Apply the release version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: node .github/scripts/set-cargo-version.mjs "$VERSION"

      - name: Build release binary
        env:
          ENGINE_TARGET: ${{ matrix.target }}
          ENGINE_FEATURES: ${{ matrix.features }}
        run: cd rust && cargo build --release --target "$ENGINE_TARGET" --features "$ENGINE_FEATURES" --no-default-features
      - name: Prepare artifact
        env:
          ENGINE_TARGET: ${{ matrix.target }}
          RUNNER_IMAGE: ${{ matrix.os }}
          ENGINE_BINARY: ${{ matrix.binary }}
        run: |
          src="rust/target/$ENGINE_TARGET/release/kesha-engine"
          if [ "$RUNNER_IMAGE" = "windows-latest" ]; then src="${src}.exe"; fi
          cp "$src" "$ENGINE_BINARY"

      - name: Stage AVSpeech sidecar (macOS)
        if: matrix.os == 'macos-14'
        env:
          ENGINE_TARGET: ${{ matrix.target }}
        run: bash .github/scripts/stage-darwin-sidecar.sh say-avspeech "system_tts feature may not have compiled"
      - name: Stage kesha-textlang sidecar (macOS)
        if: matrix.os == 'macos-14'
        env:
          ENGINE_TARGET: ${{ matrix.target }}
        run: bash .github/scripts/stage-darwin-sidecar.sh kesha-textlang "build.rs::build_text_lang_helper may have failed"

      - name: Smoke-test binary
        env:
          ENGINE_BINARY: ${{ matrix.binary }}
          RUNNER_IMAGE: ${{ matrix.os }}
        run: bash .github/scripts/smoke-engine-binary.sh

      # darwin synthesises in `darwin-synthesis-smoke` instead — macos-14's CoreML cannot run the vocoder (#678).
      - name: 🍞 Setup Bun workspace
        if: matrix.os != 'macos-14'
        uses: ./.github/actions/setup-bun
      - name: 🔗 Link the CLI
        if: matrix.os != 'macos-14'
        run: bun link
      # Load-bearing: on a version mismatch `installEngine` fetches the published engine, whose tag does not exist yet.
      - name: 🧾 Mark staged engine version
        if: matrix.os != 'macos-14'
        run: bun .github/scripts/mark-engine-version.ts
      - name: 🔊 Install English TTS models
        if: matrix.os != 'macos-14'
        uses: ./.github/actions/install-kesha-backend
        with:
          cache-path: .kesha-ci-cache
          cache-key: kesha-models-tts-v3
          cache-cross-os: "true"
          ffmpeg-provider: skip
          install-args: --tts en
          cache-write: "false"
      # `install --tts en` already fetched the ASR models, so transcribing the synthesis back costs no download.
      - name: 🗣️ Pre-upload synthesis round trip
        if: matrix.os != 'macos-14'
        run: bun .github/scripts/smoke-synthesis.ts synthesis-smoke

      - name: Inspect macOS dynamic deps
        if: matrix.os == 'macos-14'
        env:
          ENGINE_BINARY: ${{ matrix.binary }}
        run: otool -L "$ENGINE_BINARY" && otool -l "$ENGINE_BINARY" | grep -A2 LC_RPATH || true

      - name: Upload engine artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}
      - name: Upload AVSpeech sidecar (macOS)
        if: matrix.os == 'macos-14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: say-avspeech-darwin-arm64
          path: say-avspeech-darwin-arm64
      - name: Upload kesha-textlang sidecar (macOS)
        if: matrix.os == 'macos-14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kesha-textlang-darwin-arm64
          path: kesha-textlang-darwin-arm64

  # macos-14 CoreML cannot run the vocoder (#678); the Kokoro sentence was measured 20/20 on CPU CoreML, do not swap it (#742).
  darwin-synthesis-smoke:
    name: Smoke (darwin-arm64 synthesis)
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    env:
      KESHA_ENGINE_BIN: ${{ github.workspace }}/kesha-engine-darwin-arm64
      # FluidAudio reports CoreML failures on stdout, which the bridge guard discards; this routes them to stderr (#678).
      KESHA_DEBUG: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kesha-engine-darwin-arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: say-avspeech-darwin-arm64
      # `helper_path` probes for a `say-avspeech` sibling, and no release exists yet to top it up from (#678).
      - name: Restore the executable bits upload-artifact drops
        run: |
          cp -f say-avspeech-darwin-arm64 say-avspeech
          chmod +x kesha-engine-darwin-arm64 say-avspeech-darwin-arm64 say-avspeech
      - name: 🍞 Setup Bun workspace
        uses: ./.github/actions/setup-bun
      - name: 🔗 Link the CLI
        run: bun link
      - name: 🧾 Mark staged engine version
        run: bun .github/scripts/mark-engine-version.ts
      # cache-seed.yml's `kesha-models-darwin` is this key's only writer; path, key and archive mode must match it (#877).
      - name: 🔊 Install English TTS models
        uses: ./.github/actions/install-kesha-backend
        with:
          cache-path: |
            ~/.cache/kesha
            ~/.cache/fluidaudio
          cache-key: ${{ runner.os }}-kesha-models-tts-v1
          cache-restore-keys: ${{ runner.os }}-kesha-models-tts-
          ffmpeg-provider: skip
          install-args: --tts en
          cache-write: "false"
      - name: 🗣️ Synthesis smoke — Kokoro
        run: bun .github/scripts/smoke-synthesis.ts --no-roundtrip --text "Kesha speaks." synthesis-smoke
      # AVSpeech needs no accelerator, so it carries the full sentence; it runs even when Kokoro is red (#678).
      - name: 🗣️ Synthesis smoke — AVSpeech sidecar
        if: ${{ !cancelled() }}
        run: bun .github/scripts/smoke-synthesis.ts --no-roundtrip --voice macos-en-US avspeech-smoke

  # The manual draft smoke of release-install-smoke.yml, moved ahead of publication onto the artifact.
  roundtrip-smoke:
    name: Smoke (linux-x64 round trip)
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kesha-engine-linux-x64
          path: engine-artifact
      - uses: ./.github/actions/setup-bun
      - name: Round-trip the artifact through an isolated user path
        env:
          ASSET_DIR: ${{ github.workspace }}/engine-artifact
          ENGINE_VERSION: ${{ needs.plan.outputs.version }}
        run: .github/scripts/release-install-smoke.sh artifact

  # Before the release, not after it: an immutable release refuses any asset once published.
  packages:
    name: Linux packages
    needs: [classify, plan]
    if: needs.classify.outputs.channel == 'stable' && needs.classify.outputs.build_engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Apply the release version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: node .github/scripts/set-package-version.mjs "$VERSION"
      - name: Build and verify packages
        uses: ./.github/actions/linux-packages
      - name: Upload the packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-packages
          path: |
            dist/linux-packages/*.deb
            dist/linux-packages/*.rpm
          if-no-files-found: error

  # `!cancelled()` lets a beta through its skipped `packages`, so every smoke's success is spelled out.
  assemble:
    name: Assemble the release
    needs: [classify, plan, build, darwin-synthesis-smoke, roundtrip-smoke, packages]
    if: >-
      !cancelled()
      && needs.classify.outputs.build_engine == 'true'
      && needs.build.result == 'success'
      && needs.darwin-synthesis-smoke.result == 'success'
      && needs.roundtrip-smoke.result == 'success'
      && (needs.packages.result == 'success' || (needs.packages.result == 'skipped' && needs.classify.outputs.channel != 'stable'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Tag objects for the annotation the notes come from; a lightweight tag carries none (#815).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          fetch-depth: 0
      # anchore/sbom-action writes into this directory but does not create it.
      - name: Prepare release asset directory
        run: mkdir -p release-assets
      - name: Prepare release notes from the tag annotation
        env:
          TAG_NAME: ${{ needs.plan.outputs.tag }}
          SIGNING_REF: ${{ github.ref }}
        run: node .github/scripts/engine-release-notes.mjs > release-notes.md
      - name: Generate source SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: release-assets/kesha-voice-kit-${{ needs.plan.outputs.tag }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      - uses: ./.github/actions/setup-bun
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: release-assets
      - name: Generate release manifest
        env:
          TAG_NAME: ${{ needs.plan.outputs.tag }}
          WITH_PACKAGES: ${{ needs.packages.result == 'success' }}
        run: |
          packages=(); if [ "$WITH_PACKAGES" = true ]; then packages=(--linux-packages); fi
          node .github/scripts/release-manifest.mjs --tag "$TAG_NAME" "${packages[@]}" --out release-assets/kesha-release-manifest.json
      - name: Generate release checksums
        run: bash .github/scripts/release-checksums.sh release-assets
      - name: Check the assembled assets against the manifest
        run: bun .github/scripts/check-release-assets.ts release-assets
      - name: Hand the checksums to the npm jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-checksums
          path: release-assets/SHA256SUMS
          if-no-files-found: error
      - name: Hand the release to github-release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            release-assets
            release-notes.md
          if-no-files-found: error

  # The only job holding contents: write with OIDC; a rehearsal never reaches it.
  github-release:
    name: GitHub release
    needs: [classify, plan, assemble]
    if: needs.plan.outputs.publish == 'true' && needs.assemble.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign release assets
        run: bash .github/scripts/sign-release-assets.sh release-assets
      # Immediately before publishing: a re-pointed tag must not publish a superseded commit (#1115); a dispatch has no tag yet.
      - name: Verify tag has not been superseded
        env:
          TAG_NAME: ${{ needs.plan.outputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          current="$(git ls-remote origin "refs/tags/$TAG_NAME" "refs/tags/$TAG_NAME^{}" | tail -1 | cut -f1)"
          if [ -z "$current" ] && [ "$REF_TYPE" != tag ]; then echo "$TAG_NAME does not exist yet; the publish creates it at $GITHUB_SHA."; exit 0; fi
          [ "$current" = "$GITHUB_SHA" ] || { echo "::error::tag $TAG_NAME points at ${current:-nothing}, but this run built $GITHUB_SHA. Refusing to publish."; exit 1; }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.plan.outputs.tag }}
          PRERELEASE: ${{ needs.classify.outputs.prerelease }}
        run: bash .github/scripts/publish-release.sh release-assets release-notes.md

  # Packs and verifies what npm-publish will publish; holds no permission, so a rehearsal runs it whole.
  npm:
    name: npm package
    needs: [classify, plan, assemble, reserve-tag]
    if: ${{ !cancelled() && (needs.assemble.result == 'success' || needs.reserve-tag.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare-npm-package
        with:
          version: ${{ needs.plan.outputs.version }}
          engine-version: ${{ needs.plan.outputs.engine_version }}
          engine-built: ${{ needs.assemble.result == 'success' }}

  # npm's single Trusted Publisher names this file (#732); the CLI never reaches npm before its Engine release is public.
  npm-publish:
    name: npm publish
    needs: [classify, plan, npm, github-release, reserve-tag]
    if: >-
      !cancelled()
      && needs.plan.outputs.publish == 'true'
      && needs.npm.result == 'success'
      && (needs.github-release.result == 'success' || (needs.classify.outputs.build_engine == 'false' && needs.reserve-tag.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare-npm-package
        with:
          version: ${{ needs.plan.outputs.version }}
          engine-version: ${{ needs.plan.outputs.engine_version }}
          engine-built: ${{ needs.github-release.result == 'success' }}
      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@latest && npm --version
      # A re-run after a successful publish no-ops instead of failing.
      - name: Check npm registry for prior publish
        id: registry
        run: |
          spec="$(jq -r '.name + "@" + .version' package.json)"
          if npm view "$spec" version >/dev/null 2>&1; then echo "already_published=true" >> "$GITHUB_OUTPUT"; echo "$spec is already on npm."; else echo "already_published=false" >> "$GITHUB_OUTPUT"; fi
      - name: Publish to npm with provenance
        if: steps.registry.outputs.already_published == 'false'
        env:
          NPM_DIST_TAG: ${{ needs.classify.outputs.dist_tag }}
        run: npm publish --provenance --access public --tag "$NPM_DIST_TAG"

  # The post-publish check release-cli.yml ran: the exact version from the registry, installed into an isolated prefix.
  npm-smoke:
    name: Smoke the published npm install
    needs: [plan, npm-publish]
    if: needs.npm-publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun
      - name: Verify the exact published package through an isolated user path
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: .github/scripts/release-install-smoke.sh npm

  homebrew:
    name: Homebrew tap
    needs: [classify, plan, github-release]
    if: ${{ !cancelled() && needs.github-release.result == 'success' && needs.classify.outputs.channel == 'stable' && needs.plan.outputs.publish == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      TAP_REPO: drakulavich/homebrew-tap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Require tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: test -n "$HOMEBREW_TAP_TOKEN" || { echo "::error::HOMEBREW_TAP_TOKEN is required to update $TAP_REPO"; exit 1; }
      - name: Clone tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://github.com/$TAP_REPO.git" tap
          git -C tap remote set-url origin "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/$TAP_REPO.git"
      - name: Update formula
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: node .github/scripts/update-homebrew-tap.mjs --tag "$TAG" --tap-dir tap
      - name: Validate updated formula
        run: bash .github/scripts/validate-homebrew-formula.sh
      - name: Commit and push tap update
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: bash .github/scripts/push-homebrew-tap.sh

  # Tag images only; the main-push image lives in ci.yml, and `latest` still comes from main as it did in docker.yml.
  docker:
    name: Docker image
    needs: [classify, plan, github-release]
    if: ${{ !cancelled() && needs.github-release.result == 'success' && needs.classify.outputs.channel == 'stable' && needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/drakulavich/kesha-voice-kit
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A release created with GITHUB_TOKEN fires no `release: published`, so the follow-up that leads main to the next version is a job here.
  post-release:
    name: Lead main to the next version
    needs: [classify, plan, github-release]
    if: ${{ !cancelled() && needs.github-release.result == 'success' && needs.classify.outputs.channel == 'stable' && needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: post-release
      cancel-in-progress: false
    env:
      REPOSITORY: drakulavich/kesha-voice-kit
      TAG_NAME: ${{ needs.plan.outputs.tag }}
      BRANCH: automation/post-release-${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - name: Decide whether this tag is ours and no other follow-up is in flight
        id: shape
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OPEN_HEADS="$(gh pr list --repo "$REPOSITORY" --state open --json headRefName -q '.[].headRefName')" \
          REMOTE_HEADS="$(git ls-remote --heads origin 'refs/heads/automation/post-release-*' | cut -f2)" \
          bun .github/scripts/post-release-guard.ts >> "$GITHUB_OUTPUT"
      - name: Refuse an existing follow-up branch or PR
        id: existing
        if: steps.shape.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/refuse-existing-followup.sh
      - name: Read the published release and prepare the follow-up
        if: steps.shape.outputs.skip != 'true' && steps.existing.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun .github/scripts/post-engine-release.ts --tag "$TAG_NAME"
      - name: Validate and record output
        if: steps.shape.outputs.skip != 'true' && steps.existing.outputs.skip != 'true'
        run: bash .github/scripts/record-post-release-validation.sh
      - name: Commit and push the follow-up branch
        if: steps.shape.outputs.skip != 'true' && steps.existing.outputs.skip != 'true'
        run: bash .github/scripts/push-post-release-branch.sh
      - name: Open the follow-up pull request
        if: steps.shape.outputs.skip != 'true' && steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/open-post-release-pr.sh
