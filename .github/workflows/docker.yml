name: "🐳 Docker"

on:
  push:
    branches: [main]
    # A tag ref skips the path filter below, so every alpha would ship a GHCR image (#685).
    tags:
      - "v*"
      - "!v*-alpha*"

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/drakulavich/kesha-voice-kit

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔍 Detect Docker-relevant changes
        if: github.ref_type == 'branch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            docker:
              - Dockerfile
              - .dockerignore
              - compose.yml
              - package.json
              - bun.lock
              - bin/**
              - src/**
              - tests/fixtures/benchmark/**
              - tests/fixtures/benchmark-en/**
              - .github/workflows/docker.yml

      - name: 🔐 Login to GHCR
        if: github.ref_type == 'tag' || steps.filter.outputs.docker == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Docker metadata
        if: github.ref_type == 'tag' || steps.filter.outputs.docker == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🧰 Setup Docker Buildx
        if: github.ref_type == 'tag' || steps.filter.outputs.docker == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: 📦 Build and publish image
        if: github.ref_type == 'tag' || steps.filter.outputs.docker == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
