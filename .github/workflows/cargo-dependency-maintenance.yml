name: "🦀 Cargo Dependency Maintenance"

on:
  schedule:
    # Monthly signal for Rust dependency drift. Dependabot's cargo ecosystem
    # remains disabled here because its runner hits sparse-index curl errors.
    - cron: "17 7 1 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "UTC month to open, formatted YYYY-MM. Defaults to the current month."
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  checklist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # An install failure only degrades the report; the script records it and still opens the checklist.
      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        continue-on-error: true
        with:
          tool: cargo-outdated@0.19.0

      - name: 🧾 Open monthly Cargo checklist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REQUESTED_MONTH: ${{ inputs.month }}
        shell: bash
        run: .github/scripts/cargo-maintenance-issue.sh
