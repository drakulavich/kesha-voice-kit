name: "🧪 Rust Tests"

on:
  # Run on EVERY PR (no top-level path filter). A path-filtered workflow is
  # skipped on unrelated PRs, so its required status check never reports and
  # permanently blocks the PR (e.g. a docs-only change). Instead a cheap
  # `changes` job always runs and the expensive rust jobs gate on its output —
  # skipped jobs report success, satisfying branch protection.
  pull_request:
  push:
    branches: [main]
    paths:
      - "rust/**"
      - "rust-toolchain.toml"
      - ".github/workflows/rust-test.yml"

permissions:
  contents: read

jobs:
  # Always runs (even on docs PRs) so the workflow concludes successfully and
  # its required check reports; outputs gate the heavy rust jobs below.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      coreml: ${{ steps.filter.outputs.coreml }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - 'rust/**'
              - 'rust-toolchain.toml'
              - '.github/workflows/rust-test.yml'
              - '.github/scripts/check-coverage.ts'
              - 'package.json'
              - 'bun.lock'
            # Narrow surface for the ANE decoder-state guard (#592): the
            # FluidAudio backend + its regression test, the coreml feature
            # wiring in Cargo.toml, and Cargo.lock — which pins the exact
            # fluidaudio-rs commit, so a bump (the regression vector) always
            # lands here even though it's a git-branch dep.
            coreml:
              - 'rust/src/backend/fluidaudio.rs'
              # The lane's diagnostics ride KESHA_DEBUG's sink selection (#841).
              - 'rust/src/fluid_stdout.rs'
              # The only lane that *runs* diarize's tests; everything else stops at clippy (#999).
              - 'rust/src/transcribe/diarize.rs'
              - 'rust/build.rs'
              - 'rust/Cargo.toml'
              - 'rust/Cargo.lock'
              - 'tests/fixtures/benchmark-en/03-review-pull-request.ogg'
              - '.github/workflows/rust-test.yml'

  # GitHub scopes a cache written during a pull_request run to that PR's merge
  # ref, so it can only ever serve re-runs of the same PR — measured on #838: the
  # first run missed and saved, only later pushes hit. Four such entries at
  # ~300 MB is ~1.2 GB per open PR, and since they are the most recently used,
  # LRU evicts the main-scoped model bundles instead. That is the mechanism
  # behind the parakeet evictions this ticket opened with (#741).
  #
  # So PR runs restore and never save. `rust-push-gate` is the only rust job that
  # runs on main, so it writes the one Linux entry `lint-ubuntu` reads through a
  # matching `shared-key` — that lane gets *warmer* than before, since its first
  # run per PR used to be cold. Lanes with no main-side writer (macOS, Windows,
  # coverage) trade their second-and-later pushes going cold for the headroom;
  # their first push was already cold either way.
  lint-ubuntu:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.94.1"
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          shared-key: linux
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install system audio deps (Opus)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libopus-dev pkg-config

      - name: Check formatting
        run: cd rust && cargo fmt -- --check

      - name: Clippy
        run: bash rust/ci/run-clippy.sh Linux

  test:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true'
    permissions:
      contents: read
      # Flakiness.io CLI authenticates via GitHub OIDC; scope the
      # write capability to this job only so a future second job in
      # this workflow doesn't inherit it implicitly (symmetric with
      # the per-job scoping in ci.yml per Greptile #301).
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      KOKORO_CACHE: ${{ github.workspace }}/.kokoro-spike
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      # This lane stages models, so a gate that can't find them is a broken
      # layout, not a laptop — fail instead of skipping to a green run of
      # nothing (#741). `mini` also fails if real weights reappear here, which is
      # what keeps the download from creeping back. Lanes that stage nothing
      # (rust-push-gate) leave it unset.
      KESHA_REQUIRE_MODEL_TESTS: mini
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode 16 (Swift 6)
        if: matrix.os == 'macos-14'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "16.2"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.94.1"
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `cargo nextest` replaces `cargo test` for the actual run — it
      # parallelizes per-binary, surfaces flakiness explicitly, and emits
      # JUnit XML via the `ci` profile (see rust/.config/nextest.toml).
      # taiki-e/install-action caches a prebuilt binary per OS/arch so
      # the install is ~1s on warm cache.
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: nextest

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'

      - name: Pin MSVC linker (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # Git for Windows ships a GNU `link.exe` under /c/Program Files/Git/usr/bin
        # that shadows MSVC's link.exe under `shell: bash`. Pin via cargo's env
        # knob so PATH ordering doesn't matter.
        run: |
          $linkPath = (Get-Command link.exe |
            Where-Object { $_.Source -notlike "*Git*usr*" } |
            Select-Object -First 1).Source
          if (-not $linkPath) { Write-Error "MSVC link.exe not found"; exit 1 }
          Write-Host "MSVC linker: $linkPath"
          Add-Content -Path $env:GITHUB_ENV -Value "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linkPath"

      - name: Install system audio deps (Opus)
        # audiopus_sys 0.2.2 / opusic-sys 0.6.0 (added in #224 for OGG/Opus
        # output) try pkg-config first; on miss they fall back to a vendored
        # libopus build via cmake whose CMakeLists.txt declares
        # `cmake_minimum_required(VERSION <3.5)`. Linux/macOS: install the
        # system lib so pkg-config succeeds and cmake never runs. Windows:
        # set `CMAKE_POLICY_VERSION_MINIMUM=3.5` so the cmake fallback build
        # is forgiven (cheaper than vcpkg-installing opus).
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libopus-dev pkg-config
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install opus pkg-config
          fi

      - name: Allow legacy cmake_minimum_required (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_POLICY_VERSION_MINIMUM=3.5"

      # Guard against coreml-backend rot: v1.0.0 shipped with broken
      # coreml code because no PR CI job ever tried to build it.
      - name: Check coreml feature
        if: matrix.os == 'macos-14'
        shell: bash
        # --all-targets so the `#[cfg(feature = "coreml")]` tests compile here too (#708).
        run: cd rust && cargo check --features coreml --no-default-features --all-targets

      # The default-feature nextest run (`run-cargo-test.sh`) builds only
      # `onnx,tts`, so the darwin-arm64 FluidAudio paths — `system_kokoro`
      # (#475 `--rate`), `system_diarize`, `system_tts` — and their gated
      # integration tests (`kokoro_rate_e2e.rs`, `diarize_e2e.rs`) never
      # compile in PR CI. The runtime e2e bodies can't run here (the ANE
      # Kokoro model isn't downloaded on the runner; it's a local /
      # release-smoke gate), but `--all-targets` clippy at least type-checks
      # and lints the test code + the install-time voice-pack staging so a
      # darwin-only break is caught before a release tag builds it.
      # The feature set lives in the `verify-darwin-full` recipe, so CI and the local
      # gate cannot drift apart (#797) — hence a `just` on PATH for this lane.
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        if: matrix.os == 'macos-14'
        with:
          tool: just@1.58.0
      - name: Lint darwin release feature set (incl. system_kokoro)
        if: matrix.os == 'macos-14'
        shell: bash
        run: just verify-darwin-full

      # No model cache on this lane at all: the Kokoro stand-in is committed,
      # CharsiuG2P is covered once on the Linux coverage lane rather than three
      # times, and Vosk-RU left the PR path entirely for the weekly canary (#741).
      - name: 🎚️ Stage Kokoro stand-ins
        shell: bash
        run: bash rust/ci/stage-mini-models.sh "$KOKORO_CACHE"

      - name: Run tests
        shell: bash
        run: bash rust/ci/run-cargo-test.sh "$KOKORO_CACHE" "${{ runner.os }}"

      - name: 📤 Upload JUnit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-junit-${{ matrix.os }}
          path: rust/target/nextest/ci/junit.xml
          retention-days: 7

      # The npm Flakiness CLI runs everywhere bun runs, so unlike the
      # platform-specific curl installer it covers windows-latest too.
      # Setup-bun is a no-op when bun is already on PATH (cached on warm
      # runs).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: always()
        with:
          bun-version-file: .bun-version

      - name: 🪼 Upload to Flakiness.io
        # `if: always()` runs the step but doesn't suppress its exit
        # code; `continue-on-error: true` keeps a Flakiness outage /
        # OIDC handshake failure off the test-job verdict (Greptile
        # #301 P1). Telemetry upload is best-effort, not a release gate.
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          bun .github/scripts/upload-flakiness.ts \
            rust/target/nextest/ci/junit.xml rust Laputa/kesha-voice-kit

  coverage:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KOKORO_CACHE: ${{ github.workspace }}/.kokoro-spike
      NEXTEST_PROFILE: ci
      KESHA_REQUIRE_MODEL_TESTS: mini
      # CharsiuG2P has no stand-in and its IPA goldens own phoneme fidelity, so this
      # lane still promises it. Vosk-RU moved to real-model-canary.yml: one synth test
      # was not worth ~935 MB of per-PR cache, and it needs real weights either way
      # (#741).
      KESHA_REQUIRE_G2P_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.94.1"
          components: rustfmt,clippy,llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          # No main-side writer exists for the llvm-cov flavour: instrumented
          # builds carry different RUSTFLAGS, so push-gate's plain artifacts
          # would not match this job's fingerprints anyway (#741).
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: nextest

      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-llvm-cov

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install system audio deps (Opus)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libopus-dev pkg-config

      # The only weights left on the PR path that nothing can stand in for:
      # CharsiuG2P, whose phonemiser the Kokoro mini does not replace (#741).
      - name: 🎚️ Setup real TTS models
        uses: ./.github/actions/setup-kokoro-models

      # After the restore, never before: an archive written under an older key still
      # carries a real model.onnx, and unpacking it over a staged stand-in would put
      # this lane back on weights it did not promise.
      - name: 🎚️ Stage Kokoro stand-ins
        shell: bash
        run: bash rust/ci/stage-mini-models.sh "$KOKORO_CACHE"

      - name: 📈 Rust coverage
        shell: bash
        run: |
          source rust/ci/kokoro-env.sh "$KOKORO_CACHE"
          bun run coverage:rust

      - name: 📤 Upload Ubuntu JUnit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-junit-ubuntu-latest
          path: rust/target/nextest/ci/junit.xml
          retention-days: 7

      - name: 🪼 Upload Ubuntu tests to Flakiness.io
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          bun .github/scripts/upload-flakiness.ts \
            rust/target/nextest/ci/junit.xml rust Laputa/kesha-voice-kit

      - name: 🧯 Enforce Rust coverage gates
        run: bun run coverage:check:rust

      - name: 📊 Coverage summary
        if: always()
        shell: bash
        run: |
          if [[ -f coverage/rust/summary.md ]]; then
            cat coverage/rust/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 📤 Upload Rust coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-rust
          path: coverage/rust
          retention-days: 30

  rust-push-gate:
    # Lean post-merge gate: catches semantic merge conflicts (two PRs green
    # alone, broken together) fast and cheap. The 3-OS matrix already ran on
    # the PR; build-engine.yml is the cross-platform release gate. Ubuntu-only
    # on purpose.
    if: github.event_name == 'push'
    permissions:
      # A job-level block replaces the inherited grant, so omitting this breaks checkout.
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.94.1"
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          # Sole rust job on main, so this is the entry `lint-ubuntu` restores.
          shared-key: linux
      - name: Install system audio deps (Opus)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libopus-dev pkg-config
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: nextest
      - name: Check formatting
        run: cd rust && cargo fmt -- --check
      - name: Clippy
        run: bash rust/ci/run-clippy.sh Linux
      - name: Tests
        # `--profile ci` is what emits target/nextest/ci/junit.xml for the upload below.
        run: cd rust && cargo nextest run --profile ci --features tts

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: always()
        with:
          bun-version-file: .bun-version

      - name: 🪼 Upload to Flakiness.io
        # Gives main a Rust baseline so flip/fail rates have history to compute against.
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          bun .github/scripts/upload-flakiness.ts \
            rust/target/nextest/ci/junit.xml rust Laputa/kesha-voice-kit

  # Provisioned macOS arm64 lane for the FluidAudio TDT decoder-state guard
  # (#592). `transcribe_samples_is_stateless_across_calls` is `#[ignore]` +
  # `coreml`-only because it needs a real Apple Neural Engine AND the cached
  # Parakeet CoreML bundle — the per-PR macos-14 lane above only *compiles*
  # `coreml` (`cargo check`), so a fluidaudio-rs bump that dropped the upstream
  # stateless-reset fix (FluidInference/fluidaudio-rs#15) would ship the
  # multi-segment "." corruption with no automated failure.
  #
  # Runs only when the regression surface changes (the `coreml` paths-filter:
  # the FluidAudio backend, the coreml feature wiring, or the fluidaudio-rs pin
  # in Cargo.lock) — not on every PR and not nightly. The CoreML Parakeet
  # bundle is large but cached, so the fetch is a once-per-key seed.
  #
  # macos-14 is GitHub-hosted Apple Silicon, but it is an `Apple M1 (Virtual)` VM
  # with **no** Neural Engine (#742 measured `ioreg -c AppleARMIODevice | grep -ci
  # ane` at 0 there against 32 on a real M2), so the ANE-converted Parakeet chain
  # actually executes through BNNS on the CPU. The guard still catches a
  # fluidaudio-rs bump that drops the stateless-reset fix, which is what #592
  # asked of it; it just does not exercise the ANE.
  coreml-regression:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.coreml == 'true'
    runs-on: macos-14
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      NEXTEST_PROFILE: ci
      # The Swift bridge collapses every transcribe throw to "Transcription
      # failed" and prints the real error with `print`, i.e. onto the stdout the
      # backend silences. Debug routes that sink to stderr so #841's warm-cache
      # failure names its own cause (#678 does the same for darwin synthesis).
      KESHA_DEBUG: "1"
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The regression fixture (03-review-pull-request.ogg) is a Git LFS
          # asset; the test fails fast on an unmaterialized pointer.
          lfs: true
      - name: Select Xcode 16 (Swift 6)
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "16.2"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.94.1"
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: nextest

      - name: Install system audio deps (Opus)
        run: brew install opus pkg-config

      # Restore-only: this job runs on pull_request, and GitHub scopes a cache to
      # the ref that wrote it, so anything saved here is readable by re-runs of
      # this PR alone — never by main, never by another PR (#675, the defect #663
      # fixed for Kokoro). cache-seed.yml writes this key from main instead.
      # On a miss the bundle is still fetched during the test's `init_asr()`;
      # the run is slower, not wrong.
      - name: 🎧 Restore Parakeet CoreML models
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Must track `models::fluidaudio_asr_location`. A runner has no legacy bundle, so
          # the engine roots it under the Kesha cache; caching the old Application Support
          # path would restore where nothing reads and save where nothing wrote (#688).
          path: ~/.cache/kesha/fluidaudio/parakeet-tdt-0.6b-v3
          # Keyed on the fluidaudio-rs pin (Cargo.lock): a bump changes the model
          # set. The prefix restore-key warm-starts from the prior bundle so a
          # bump tops up the delta instead of re-fetching everything.
          key: parakeet-coreml-models-v2-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            parakeet-coreml-models-v2-${{ runner.os }}-

      - name: 🧪 CoreML decoder-state regression
        run: |
          cd rust
          # Without this nextest swallows a passing test's output, and the ANE gate's
          # "this guard did not run" line is exactly that (#841).
          # `system_diarize` rides along because `transcribe::diarize` compiles under no other
          # lane, so its tests only ever got clippy'd; they are pure and cost 0.14 s (#999).
          # `fluid_stdout` builds under no other lane, so without these two the fd 1 locks are unpinned in CI (#951).
          cargo nextest run \
            --no-default-features --features coreml,system_diarize \
            --run-ignored all \
            --success-output immediate \
            -E 'test(transcribe_samples_is_stateless_across_calls) + test(debug_routes_silenced_chatter_to_stderr) + test(a_sub_second_file_transcribes_instead_of_erroring) + test(transcribe::diarize::) + test(scoped_guards_serialize_stdout_ownership) + test(permanent_shield_waits_for_a_live_scoped_guard)'

      - name: 📤 Upload JUnit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-junit-coreml-regression
          path: rust/target/nextest/ci/junit.xml
          retention-days: 7

  # Aggregator gate = the single required status check for branch protection.
  # Always runs so the context reports on every PR (the heavy jobs above skip on
  # non-rust PRs → success); the step fails the gate only if a real job failed.
  # `coreml-regression` is included so a red decoder-state guard blocks a PR
  # that touches the regression surface (it reports 'skipped' — not 'failure' —
  # on PRs that don't, so it never blocks unrelated work).
  rust-tests:
    name: 🧪 Rust Tests
    if: always()
    needs: [changes, lint-ubuntu, test, coverage, coreml-regression]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
