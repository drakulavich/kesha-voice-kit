name: "🍺 Homebrew Tap"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable release tag to publish to Homebrew (vX.Y.Z)"
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  update:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      TAP_REPO: drakulavich/homebrew-tap
    steps:
      - name: Resolve tag
        id: tag
        # Stays inline: it runs before the checkout, so no script exists yet. `inputs.tag` is required on dispatch, so `&&` never falls through to the release tag.
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then printf 'tag=%s\nskip=false\n' "$TAG" >> "$GITHUB_OUTPUT"
          else echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Skipping Homebrew tap update for non-stable tag: $TAG"; fi

      - name: Checkout workflow source
        if: steps.tag.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node.js
        if: steps.tag.outputs.skip != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Require tap token
        if: steps.tag.outputs.skip != 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: test -n "$HOMEBREW_TAP_TOKEN" || { echo "::error::HOMEBREW_TAP_TOKEN is required to update $TAP_REPO"; exit 1; }

      - name: Clone tap
        if: steps.tag.outputs.skip != 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://github.com/$TAP_REPO.git" tap
          git -C tap remote set-url origin "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/$TAP_REPO.git"

      - name: Update formula
        if: steps.tag.outputs.skip != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: node .github/scripts/update-homebrew-tap.mjs --tag "$TAG" --tap-dir tap

      - name: Validate updated formula
        if: steps.tag.outputs.skip != 'true'
        run: bash .github/scripts/validate-homebrew-formula.sh

      - name: Commit and push tap update
        if: steps.tag.outputs.skip != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: bash .github/scripts/push-homebrew-tap.sh
