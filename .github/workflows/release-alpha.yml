name: "🌱 Release (Alpha) (reusable)"

# Decides whether a merged PR asked for a CLI alpha with the `alpha` label, and reserves the
# derived version by tagging (#685). It deliberately does not publish: npm Trusted Publishing
# validates the name of the workflow that *entered* the run and a package configures exactly
# one, so npm-publish.yml owns every publish and calls this (#732). Neither job touches npm,
# so the entry name they run under does not matter.
#
# No concurrency group of its own: the caller serialises the whole lane, which is the right
# granularity — deriving a sequence while another run holds an unpublished tag reuses it.
on:
  workflow_call:
    outputs:
      publish:
        description: "Whether this commit earned an alpha"
        value: ${{ jobs.decide.outputs.publish }}
      version:
        description: "Derived alpha version, e.g. 1.27.0-alpha.3"
        value: ${{ jobs.decide.outputs.version }}
      tag:
        description: "Tag reserved for it, e.g. v1.27.0-alpha.3-cli"
        value: ${{ jobs.decide.outputs.tag }}
      dist_tag:
        description: "npm dist-tag the derived version publishes under"
        value: ${{ jobs.decide.outputs.dist_tag }}

# No workflow-level `permissions`: a called workflow may only maintain or reduce what the
# caller granted, so a `contents: read` default here could be read as capping `reserve-tag`
# below the write it needs. Every job below states its own instead.
defaults:
  run:
    shell: bash

jobs:
  decide:
    name: Decide and derive
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      publish: ${{ steps.publishable.outputs.publish }}
      version: ${{ steps.derive.outputs.version }}
      tag: ${{ steps.derive.outputs.tag }}
      previous: ${{ steps.derive.outputs.previous }}
      dist_tag: ${{ steps.dist.outputs.dist_tag }}
    steps:
      # Full history and tags: the sequence is counted from tags, and a shallow checkout
      # looks identical to a repository that has none.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      # The composite installs dependencies: the `bun test` gate below needs them (#993).
      - uses: ./.github/actions/setup-bun

      - name: Changed paths
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: .github/scripts/changed-paths.sh

      - name: Is the change publishable
        id: packed
        run: bun .github/scripts/alpha-publishable.ts < changed-paths.txt >> "$GITHUB_OUTPUT"

      # The label is the intent; the packed-path check is the safety net. A manual run is
      # the escape hatch for a PR that was merged before anyone remembered the label.
      - name: Did the merged PR ask for an alpha
        id: publishable
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          PACKED: ${{ steps.packed.outputs.publish }}
        run: .github/scripts/alpha-requested.sh >> "$GITHUB_OUTPUT"

      # Trusted before it produces a version — passing in general CI does not gate this run.
      - name: Test the derivation
        if: steps.publishable.outputs.publish == 'true'
        run: bun test tests/unit/derive-alpha-version.test.ts tests/unit/npm-dist-tag.test.ts

      - name: Derive the alpha version
        id: derive
        if: steps.publishable.outputs.publish == 'true'
        run: bun .github/scripts/derive-alpha-version.ts cli >> "$GITHUB_OUTPUT"

      - name: Resolve npm dist-tag
        id: dist
        if: steps.publishable.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.derive.outputs.version }}
        run: echo "dist_tag=$(bun .github/scripts/npm-dist-tag.mjs "$VERSION")" >> "$GITHUB_OUTPUT"

  # `contents: write` and no OIDC: tagging and provenance publishing never share a job.
  reserve-tag:
    name: Reserve the version
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      # Before the publish, not after: npm holding a version no tag records lets the next
      # derivation reuse it, and the prior-publish guard turns that into a silent skip.
      - name: Tag the built commit
        env:
          TAG: ${{ needs.decide.outputs.tag }}
          SHA: ${{ github.sha }}
          PREVIOUS: ${{ needs.decide.outputs.previous }}
        run: .github/scripts/alpha-tag.sh
