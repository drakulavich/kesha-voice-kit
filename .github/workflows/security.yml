name: "🛡️ Security Audit"

on:
  # Run on EVERY PR (no top-level path filter). A path-filtered workflow is
  # skipped on unrelated PRs, so its required status checks never report and
  # permanently block the PR. A cheap `changes` job always runs; the audit jobs
  # gate on its output (skipped jobs report success, satisfying branch
  # protection) so docs-only PRs aren't blocked.
  pull_request:
  # Only the plugin scan runs on a push to main, as it did in its own workflow.
  push:
    branches: [main]
  schedule:
    # Weekly advisory-DB re-check against unchanged deps (RUSTSEC/npm
    # advisories update independently of our code). Offset from the
    # monthly cargo-dependency-maintenance cron so they don't collide.
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Must include the ref: a workflow-wide group serialises every PR into one
  # queue, and GitHub evicts the pending run when a third arrives — the evicted
  # run reports nothing, so the required "🛡️ Security Audit" check never lands
  # and the PR is BLOCKED forever (#597, evicted by #596/#598 in the same second).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # Always runs so the required checks always report; outputs gate the audits.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            deps:
              - 'rust/Cargo.toml'
              - 'rust/Cargo.lock'
              - 'rust/deny.toml'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/security.yml'

  cargo-deny:
    needs: changes
    # Run for scheduled/manual audits, or on PRs that touch dependencies. On a
    # PR that doesn't, this skips → reports success → satisfies branch protection.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && needs.changes.outputs.deps == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Only the scheduled run needs to upsert the findings issue.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: rust/Cargo.toml
          command: check advisories licenses bans sources
        continue-on-error: true
      - name: Report findings (scheduled only)
        if: github.event_name == 'schedule' && steps.deny.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/report-cargo-deny.sh
      - name: Fail job if deny failed on PR
        if: github.event_name != 'schedule' && steps.deny.outcome == 'failure'
        run: |
          echo "::warning::cargo-deny reported findings (non-blocking until promotion PR)"
          exit 1

  bun-audit:
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && needs.changes.outputs.deps == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Only the scheduled run needs to upsert the findings issue.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install deps (frozen lockfile)
        run: bun install --frozen-lockfile
      - id: audit
        name: Audit JS dependencies
        # No patched braces yet; drop the ignore with #1397.
        run: bun audit --audit-level=high --ignore GHSA-vfj7-8cjw-p6xm
        continue-on-error: true
      - name: Report findings (scheduled only)
        if: github.event_name == 'schedule' && steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/report-bun-audit.sh
      - name: Fail job if audit failed on PR
        if: github.event_name != 'schedule' && steps.audit.outcome == 'failure'
        run: |
          echo "::warning::bun audit reported findings (non-blocking until promotion PR)"
          exit 1

  # HOL plugin scanner, the check awesome-ai-plugins runs on every listing
  # (hashgraph-online/awesome-ai-plugins#291). Same pinned action as the
  # catalog sweep; contents: read only, no secrets, credentials not persisted.
  # Not in the aggregator: it never gated a merge in its own workflow either.
  plugin-scan:
    name: 🛡️ Plugin Security Scan
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🔍 Scan
        uses: hashgraph-online/ai-plugin-scanner-action@e0f4fdf0a0bb1027f5419a4732c7357bdff2561c # v1.2.709
        with:
          plugin_dir: "."
          min_score: 80
          fail_on_severity: high

  # Aggregator gate = the single required status check for branch protection.
  # Always runs so the context reports on every PR (the audits skip on PRs that
  # don't touch dependencies → success); fails only if a real job failed.
  security-audit:
    name: 🛡️ Security Audit
    if: always()
    needs: [changes, cargo-deny, bun-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
