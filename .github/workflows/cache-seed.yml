name: "🌱 Seed shared caches"

# Populates the shared model caches on main so PR lanes only ever *read* them.
#
# GitHub scopes a cache to the ref that wrote it: a PR-scoped entry is invisible
# to main and to every other PR. With the TTS lanes saving from PR runs, each open
# PR minted its own ~1.1 GB Kokoro cache per OS. Two open PRs were enough to push
# the repo past the 10 GB budget, and GitHub then evicted by LRU — taking out the
# ~450 MB Parakeet CoreML bundle within a day, so coreml-regression re-downloaded
# it on every run (#661).
#
# Seeding here means one copy per OS, on main, readable by every PR. PR reads
# refresh last-access, so the entries stay warm without anyone writing them.
#
# Restore and download come from setup-kokoro-models, the same composite action
# the PR lanes use, so the key and the download call have one definition. This
# workflow only adds the two steps a reader must not have: the probe and the save.

on:
  push:
    branches: [main]
    # Only a change to a file some cache key hashes can make a re-seed necessary.
    # Without this filter every push to main — up to 26 a day here — spun runners
    # to probe a guaranteed hit. Cargo.lock is here for the Parakeet key (#675).
    paths:
      - "rust/ci/download-kokoro.sh"
      - "rust/src/models.rs"
      - "rust/Cargo.lock"
      - ".github/workflows/cache-seed.yml"
  # Eviction does not wait for pushes. Without this, a bundle evicted under budget
  # pressure stays gone until someone happens to touch the download script, and
  # every PR job in between pays a full cold download.
  schedule:
    - cron: "17 5 * * *"
  # Manual re-seed after a purge, without waiting for either of the above.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One seeding run at a time. Deliberately not cancel-in-progress: a queued run
  # only re-probes, while cancelling would throw away a multi-GB download already
  # in flight.
  group: cache-seed
  cancel-in-progress: false

jobs:
  kokoro:
    name: Kokoro models (${{ matrix.os }})
    # Linux only: the macOS and Windows lanes run against the committed Kokoro
    # stand-in and download nothing, so there is no entry left to seed for them
    # (#741). CharsiuG2P and Vosk-RU are platform-independent ONNX, covered once.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      KOKORO_CACHE: ${{ github.workspace }}/.kokoro-spike
    steps:
      # Needed before the probe: the cache key hashes rust/ci/download-kokoro.sh,
      # and hashFiles resolves against the workspace. Cheap next to the 340 MB the
      # probe is deciding about.
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # lookup-only reports whether the exact key exists without downloading the
      # payload, so the warm path never transfers the bundle it is protecting.
      # cache-hit is only ever 'true' for an exact match, so a changed script
      # always falls through to a re-seed.
      - name: Probe cache
        id: probe
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.KOKORO_CACHE }}
          key: kokoro-models-v4-${{ runner.os }}-${{ hashFiles('rust/ci/download-kokoro.sh') }}
          lookup-only: true

      # Restores through the prefix key (so a model-set change tops up the delta
      # instead of re-fetching ~340 MB) and downloads whatever is still missing.
      - name: Populate models
        if: steps.probe.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-kokoro-models
        with:
          cache-dir: ${{ env.KOKORO_CACHE }}


      - name: Save TTS models
        if: steps.probe.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.KOKORO_CACHE }}
          key: kokoro-models-v4-${{ runner.os }}-${{ hashFiles('rust/ci/download-kokoro.sh') }}

  parakeet:
    name: Parakeet CoreML models
    # Without a main-scoped copy, coreml-regression's PR-scoped entry is unreadable (#675).
    runs-on: macos-14
    timeout-minutes: 40
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      # Before the probe: the key hashes rust/Cargo.lock, which hashFiles resolves in the workspace.
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Probe cache
        id: probe
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Tracks `models::fluidaudio_asr_location`: a cold runner has no legacy bundle, so
          # the engine downloads here. Saving the old Application Support path would archive
          # an empty directory and poison every PR that restores it (#688, the #675 shape).
          path: ~/.cache/kesha/fluidaudio/parakeet-tdt-0.6b-v3
          key: parakeet-coreml-models-v2-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          lookup-only: true

      - name: Select Xcode 16 (Swift 6)
        if: steps.probe.outputs.cache-hit != 'true'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "16.2"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        if: steps.probe.outputs.cache-hit != 'true'
        with:
          toolchain: stable

      # Deliberately no rust-cache: this job builds only on a miss, and its artifacts
      # cost 716 MB of a budget whose pressure already evicts the bundle it seeds.
      - name: Install system audio deps (Opus)
        if: steps.probe.outputs.cache-hit != 'true'
        run: brew install opus pkg-config

      # FluidAudio owns the bundle: install's warm-up builds the backend, which fetches on a miss.
      - name: Populate the FluidAudio ASR bundle
        if: steps.probe.outputs.cache-hit != 'true'
        run: |
          cd rust
          cargo run --no-default-features --features coreml -- install

      - name: 🍞 Setup Bun workspace
        if: steps.probe.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-bun

      # install exits 0 on a failed warm-up; the exact key is immutable, so a partial save poisons every PR (#675).
      - name: Verify the bundle before saving
        if: steps.probe.outputs.cache-hit != 'true'
        run: bun .github/scripts/verify-fluid-asr-bundle.ts

      - name: Save Parakeet CoreML models
        if: steps.probe.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/kesha/fluidaudio/parakeet-tdt-0.6b-v3
          key: parakeet-coreml-models-v2-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}

  kesha-models:
    name: Kesha models
    # The smoke lanes read `kesha-models-tts-v3` restore-only, so without this seed they
    # cold-download ~2.8 GB every run; with it, one main-scoped copy serves every PR.
    #
    # Linux only, and one entry for both platforms (#860). Everything under `models/` is a
    # SHA-256-pinned download whose URL carries no platform axis, so the Linux and Windows
    # trees were byte-identical and the pair cost 5277 MB to hold the same bytes twice. The
    # ONLY platform-specific content is `engine/` — dropped below — and `fluidaudio/`, which
    # exists on coreml builds alone and so never lands here.
    #
    # `path:` is workspace-relative and must stay that way. A cross-OS archive stores members
    # relative to GITHUB_WORKSPACE and extracts them the same way, with no remap to the
    # consumer's home: `~/.cache/kesha` saved here would land beside the Windows workspace
    # root instead of in %USERPROFILE%, and still report a cache hit. `cross-os-cache-probe.yml`
    # is the executable proof, and actions/cache's own tips-and-workarounds says the same.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KESHA_CACHE_DIR: ${{ github.workspace }}/.kesha-ci-cache
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Probe cache
        id: probe
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .kesha-ci-cache
          key: kesha-models-tts-v3
          enableCrossOsArchive: true
          lookup-only: true

      - name: 🍞 Setup Bun workspace
        if: steps.probe.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-bun

      - name: Populate models
        if: steps.probe.outputs.cache-hit != 'true'
        uses: ./.github/actions/install-kesha-backend
        with:
          ffmpeg-provider: skip
          install-args: --tts en

      # `kesha install` also lands a Linux engine binary here. No consumer reads it — three purge
      # the dir outright via the action's `engine-dir`, the rest point `KESHA_ENGINE_BIN` elsewhere —
      # and shipping it to a Windows runner would be a wrong-arch binary in a shared entry.
      - name: Drop the platform-specific engine before saving
        if: steps.probe.outputs.cache-hit != 'true'
        shell: bash
        run: |
          rm -rf "$KESHA_CACHE_DIR/engine"
          test ! -e "$KESHA_CACHE_DIR/engine"

      - name: Save models
        if: steps.probe.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .kesha-ci-cache
          key: kesha-models-tts-v3
          enableCrossOsArchive: true

  kesha-models-darwin:
    name: Kesha models (darwin TTS)
    # The writer `macOS-kesha-models-tts-v1` never had. `darwin-synthesis-smoke` restores that key
    # restore-only and gates every engine tag (#819), so without this job it cold-downloaded the whole
    # model set from Hugging Face on each tag build — 23 of 29 historical failures on that lane were HF
    # network errors at exactly the fetch step (#877). The schedule above is what keeps it warm between
    # releases; a release-only lane would otherwise be evicted long before the next tag.
    #
    # A separate entry from `kesha-models-tts-v3`, not an oversight: a darwin build stages FluidAudio
    # ANE bundles the ONNX lanes never fetch, and Kokoro's G2P assets live under `~/.cache/fluidaudio`,
    # a path upstream pins and `KESHA_CACHE_DIR` cannot move (#688). So this entry is home-relative and
    # same-OS by construction — no `enableCrossOsArchive`, and none of the #860 remap rules apply,
    # because a same-OS archive restores to the home directory it was saved from.
    #
    # Runner matched to the consumer's `macos-15`: the payload is data, but the smoke below runs the
    # same CoreML path that lane does, and only there is it evidence.
    runs-on: macos-15
    timeout-minutes: 40
    env:
      # FluidAudio reports CoreML failures on stdout, which the bridge guard discards (#678).
      KESHA_DEBUG: "1"
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Probe cache
        id: probe
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/kesha
            ~/.cache/fluidaudio
          key: ${{ runner.os }}-kesha-models-tts-v1
          lookup-only: true

      - name: 🍞 Setup Bun workspace
        if: steps.probe.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-bun

      # No cache inputs: the probe above already decided, and the save below is this job's own step.
      - name: Populate models
        if: steps.probe.outputs.cache-hit != 'true'
        uses: ./.github/actions/install-kesha-backend
        with:
          ffmpeg-provider: skip
          install-args: --tts en

      # `install` exits 0 on a failed warm-up and the exact key is immutable, so a partial save would
      # poison every later tag build instead of being repaired (#675). Synthesising is the consumer's
      # own check, run before the bytes are archived. The short sentence is load-bearing: a hosted
      # runner has no ANE, and its CPU CoreML takes SIGBUS on longer shapes (#742).
      - name: Verify the bundle synthesises before saving
        if: steps.probe.outputs.cache-hit != 'true'
        shell: bash
        run: bun .github/scripts/smoke-synthesis.ts --no-roundtrip --text "Kesha speaks." synthesis-smoke

      # The consumer stages its freshly built engine and sidecar from the build artifacts, so a
      # published binary here is dead weight — and at tag time, the previous version's.
      - name: Drop the engine before saving
        if: steps.probe.outputs.cache-hit != 'true'
        shell: bash
        run: |
          rm -rf ~/.cache/kesha/engine
          test ! -e ~/.cache/kesha/engine

      - name: Save models
        if: steps.probe.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/kesha
            ~/.cache/fluidaudio
          key: ${{ runner.os }}-kesha-models-tts-v1
